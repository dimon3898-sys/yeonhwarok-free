name: WORLD ENGINE Studio authenticated read-only recovery

on:
  push:
    branches: [development/studio-auth-recovery-20261018]
    paths:
      - .github/workflows/studio-auth-readonly.yml
      - world-simulation-shorts-engine/recovery/studio-auth-recovery-v2/**
      - '!world-simulation-shorts-engine/recovery/studio-auth-recovery-v2/runs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studio-readonly-auth-${{ github.ref }}
  cancel-in-progress: false

jobs:
  readonly:
    if: github.repository == 'dimon3898-sys/yeonhwarok-free' && github.event.repository.private == false && github.ref == 'refs/heads/development/studio-auth-recovery-20261018'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
      actions: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      STUDIO_AUTH_ROOT: world-simulation-shorts-engine/recovery/studio-auth-recovery-v2
      STUDIO_HTTP_CONFIGURATION_ONLY: 'true'
    steps:
      - name: Check out only the isolated read-only collector
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: development/studio-auth-recovery-20261018
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/studio-auth-readonly.yml
            /world-simulation-shorts-engine/recovery/studio-auth-recovery-v2/**
      - name: Focused offline security and parser tests
        run: python3 -B -m unittest discover -s "$STUDIO_AUTH_ROOT/tests" -v
      - name: Reuse previous CPU result without repeating container tests
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib
          root = pathlib.Path(os.environ['STUDIO_AUTH_ROOT'])
          previous = root / 'runs/39075887886-2'
          data = (previous / 'CPU_EVIDENCE.json').read_bytes()
          expected = [line.split()[0] for line in (previous / 'SHA256SUMS').read_text().splitlines() if line.endswith('  CPU_EVIDENCE.json')]
          assert expected == [hashlib.sha256(data).hexdigest()]
          target = root / 'runs' / (os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'])
          target.mkdir(parents=True, exist_ok=False)
          (target / 'CPU_EVIDENCE.json').write_bytes(data)
          PY
      - name: Install exact verified official CLI in isolated tool environment
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib, urllib.request
          wheel = pathlib.Path(os.environ['RUNNER_TEMP']) / 'gcube_cli-0.4.2-py3-none-any.whl'
          url = 'https://files.pythonhosted.org/packages/f4/f9/338c8bf874df428db060bc360ab300ac5940abf3ad286ab4ad601d8cbaad/gcube_cli-0.4.2-py3-none-any.whl'
          with urllib.request.urlopen(url, timeout=30) as response:
              data = response.read(200_000)
          assert hashlib.sha256(data).hexdigest() == '9aafcafdc84b129ff119b4f735c0d56f09ba6898667fa3d6713a5fb85d06d692'
          wheel.write_bytes(data)
          PY
          python3 -m venv "$RUNNER_TEMP/gcube-readonly-tools"
          "$RUNNER_TEMP/gcube-readonly-tools/bin/python" -m pip install --disable-pip-version-check --no-input "$RUNNER_TEMP/gcube_cli-0.4.2-py3-none-any.whl"
      - name: Read existing workload only using approved repository Secrets if present
        env:
          GCUBE_ACCESS_TOKEN: ${{ secrets.GCUBE_ACCESS_TOKEN }}
          GCUBE_API_TOKEN: ${{ secrets.GCUBE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib, subprocess
          root = pathlib.Path(os.environ['STUDIO_AUTH_ROOT'])
          output = root / 'runs' / (os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'])
          if os.environ['STUDIO_HTTP_CONFIGURATION_ONLY'] == 'true':
              previous = root / 'runs/39078290370-1'
              data = (previous / 'CLI_RESULT.json').read_bytes()
              expected = [line.split()[0] for line in (previous / 'SHA256SUMS').read_text().splitlines() if line.endswith('  CLI_RESULT.json')]
              assert expected == [hashlib.sha256(data).hexdigest()]
              (output / 'CLI_RESULT.json').write_bytes(data)
          else:
              subprocess.run(['python3', '-B', str(root / 'collector.py'), '--cli', str(pathlib.Path(os.environ['RUNNER_TEMP']) / 'gcube-readonly-tools/bin/gcube'), '--output', str(output)], check=True)
          PY
      - name: Query shipped official HTTP log API for existing pod when streaming is unavailable
        env:
          GCUBE_ACCESS_TOKEN: ${{ secrets.GCUBE_ACCESS_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['STUDIO_AUTH_ROOT'])
          output = root / 'runs' / (os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'])
          prior = json.loads((output / 'CLI_RESULT.json').read_text())
          if prior.get('authenticated_workload_read_succeeded') and prior.get('first_actual_error') is None:
              try:
                  invocation = [str(pathlib.Path(os.environ['RUNNER_TEMP']) / 'gcube-readonly-tools/bin/python'), '-B', str(root / 'rest_evidence.py'), '--output', str(output)]
                  if os.environ['STUDIO_HTTP_CONFIGURATION_ONLY'] == 'true':
                      invocation.append('--configuration-only')
                  probe = subprocess.run(invocation, capture_output=True, timeout=180)
                  fallback = {'status':'BLOCKED','errorCode':'OFFICIAL_HTTP_PROBE_FAILED','helperExitCode':probe.returncode,'actualContainerExitCode':None,'rawOutputsPublished':False}
              except subprocess.TimeoutExpired:
                  fallback = {'status':'BLOCKED','errorCode':'OFFICIAL_HTTP_PROBE_TIMEOUT','actualContainerExitCode':None,'rawOutputsPublished':False}
          else:
              fallback = {'status':'SKIP','reason':'AUTH_REQUIRED_OR_STREAM_EVIDENCE_ALREADY_PRESENT','actualContainerExitCode':None,'rawOutputsPublished':False}
          target = output / 'REST_RESULT.json'
          if not target.exists():
              target.write_text(json.dumps(fallback, indent=2) + '\n')
          PY
      - name: Persist only sanitized reports and hashes to the isolated branch
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re
          root = pathlib.Path(os.environ['STUDIO_AUTH_ROOT']) / 'runs' / (os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'])
          files = sorted(root.glob('*.json'))
          assert {p.name for p in files} == {'CPU_EVIDENCE.json', 'CLI_RESULT.json', 'REST_RESULT.json'}
          for p in files:
              raw = p.read_text()
              json.loads(raw)
              assert not re.search(r'-----BEGIN .*PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{40,}|[?&](?:token|sig)=', raw)
          (root / 'SHA256SUMS').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.name + '\n' for p in files))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$STUDIO_AUTH_ROOT/runs/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/CPU_EVIDENCE.json" "$STUDIO_AUTH_ROOT/runs/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/CLI_RESULT.json" "$STUDIO_AUTH_ROOT/runs/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/REST_RESULT.json" "$STUDIO_AUTH_ROOT/runs/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/SHA256SUMS"
          git diff --cached --check
          git commit -m 'docs(studio): persist sanitized read-only auth and reused CPU evidence [skip ci]'
          git push origin HEAD:development/studio-auth-recovery-20261018
