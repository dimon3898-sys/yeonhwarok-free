name: WORLD ENGINE normal CPU browser readiness
on:
  push:
    branches: [audit/kw20-cpu-screen-20261109]
    paths: ['.github/workflows/world-engine-cpu-screen-readiness.yml']
permissions:
  contents: read
concurrency:
  group: world-engine-cpu-screen-readiness-20261109
  cancel-in-progress: false
jobs:
  readiness:
    if: >-
      github.run_attempt == 1 && github.event.repository.private == false &&
      github.event.head_commit.message == 'WORLD_ENGINE_CPU_SCREEN_NORMAL_HOST_A1'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: world-simulation-shorts-engine/production/cpu-screen-20261109
      - name: Confirm ordinary socket and non-GPU host
        run: |
          python3 - <<'PY'
          import socket, tempfile, pathlib, json, os
          assert os.geteuid() != 0
          assert not list(pathlib.Path('/dev').glob('nvidia[0-9]*'))
          with tempfile.TemporaryDirectory() as d:
              with socket.socket(socket.AF_UNIX) as s:
                  s.bind(d+'/normal.sock')
          print(json.dumps({'normalUnixSocket':'PASS','nonRoot':True,'gpuDevices':0}))
          PY
      - name: Install existing pinned browser dependency
        run: |
          mkdir -p "$RUNNER_TEMP/kw20-cpu-deps"
          cd "$RUNNER_TEMP/kw20-cpu-deps"
          npm install --ignore-scripts --no-audit --no-fund --save-exact playwright@1.62.1
          echo "CPU_DEPS_ROOT=$RUNNER_TEMP/kw20-cpu-deps" >> "$GITHUB_ENV"
          echo "CPU_CHROME=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - name: Normal sandboxed software WebGL screenshot
        run: node world-simulation-shorts-engine/production/cpu-screen-20261109/runner_readiness.mjs
      - name: Confirm existing private input channel
        env:
          WORLD_ENGINE_STUDIO_BACKUP_DROPBOX_APP_KEY: ${{ secrets.WORLD_ENGINE_STUDIO_BACKUP_DROPBOX_APP_KEY }}
          WORLD_ENGINE_STUDIO_BACKUP_DROPBOX_APP_SECRET: ${{ secrets.WORLD_ENGINE_STUDIO_BACKUP_DROPBOX_APP_SECRET }}
          WORLD_ENGINE_STUDIO_BACKUP_DROPBOX_REFRESH_TOKEN: ${{ secrets.WORLD_ENGINE_STUDIO_BACKUP_DROPBOX_REFRESH_TOKEN }}
        run: >-
          python3 world-simulation-shorts-engine/production/cpu-screen-20261109/private_transfer.py
          KW20_CPU_TRANSFER_PROBE_20261109.json
          6d3b1367ff113baf6a6d90a601f1f7c245cd1a5c824ba344bade3b7b0c44083a
          "$RUNNER_TEMP/private-transfer-probe.json"
# No artifacts, cache, movie, production render, build, deployment, or old tests.
