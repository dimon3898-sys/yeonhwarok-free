name: WORLD ENGINE reconciliation V1 CPU candidate image

on:
  workflow_dispatch:
  push:
    branches: [development/5s-render-reconciliation-20261020]
    paths:
      - .github/workflows/world-engine-reconciliation-v1.yml
      - world-simulation-shorts-engine/recovery/render-path-reconciliation-v1/*.py
      - world-simulation-shorts-engine/recovery/render-path-reconciliation-v1/*.mjs
      - world-simulation-shorts-engine/recovery/render-path-reconciliation-v1/*.json
      - world-simulation-shorts-engine/recovery/render-path-reconciliation-v1/Dockerfile

permissions:
  contents: read

concurrency:
  group: world-engine-reconciliation-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'dimon3898-sys/yeonhwarok-free' && github.event.repository.private == false && github.ref == 'refs/heads/development/5s-render-reconciliation-20261020'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    outputs:
      tag: ${{ steps.publish.outputs.tag }}
      digest: ${{ steps.publish.outputs.digest }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      RESULT_RUNNER_LABEL: ubuntu-24.04
      RESULT_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
      RESULT_PHASE: build
      RECONCILIATION_ROOT: world-simulation-shorts-engine/recovery/render-path-reconciliation-v1
    steps:
      - name: Checkout only manifested additive source and CI helper
        id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/world-engine-reconciliation-v1.yml
            /world-simulation-shorts-engine/recovery/**/*.py
            /world-simulation-shorts-engine/recovery/**/*.mjs
            /world-simulation-shorts-engine/recovery/**/*.json
            /world-simulation-shorts-engine/recovery/render-path-reconciliation-v1/**
            /world-simulation-shorts-engine/web/map_infographic_v1/*.mjs
      - name: Require public free standard runner and 20 GiB safe Docker headroom
        id: preflight
        run: python3 -B "$RECONCILIATION_ROOT/ci_package.py" preflight
      - name: Verify unique registry tag does not exist
        id: guard
        run: python3 -B "$RECONCILIATION_ROOT/ci_package.py" guard
      - name: Prepare isolated CPU test dependency already used by the preserved Studio
        id: dependencies
        run: |
          python3 -B - <<'PYDEPENDENCIES'
          import importlib.util, os
          from pathlib import Path
          root = Path(os.environ['RECONCILIATION_ROOT']).resolve()
          spec = importlib.util.spec_from_file_location('_reconciliation_ci_dependencies', root / 'ci_package.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          venv = Path(os.environ['RUNNER_TEMP']) / 'reconciliation-cpu-test-venv'
          module.ci.record('focused-cpu-test-venv', ['python3', '-m', 'venv', str(venv)], timeout=120)
          executable = str(venv / 'bin/python')
          module.ci.record('focused-cpu-test-numpy', [executable, '-m', 'pip', 'install', '--disable-pip-version-check', '--only-binary=:all:', '--no-deps', 'numpy==2.3.5'], timeout=180)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('RECONCILIATION_TEST_PYTHON=' + executable + '\n')
          PYDEPENDENCIES
      - name: Focused additive CPU and wiring tests with persisted safe diagnostics
        id: unit
        run: |
          python3 -B - <<'PYUNIT'
          import importlib.util, os
          from pathlib import Path
          root = Path(os.environ['RECONCILIATION_ROOT']).resolve()
          spec = importlib.util.spec_from_file_location('_reconciliation_ci_unit', root / 'ci_package.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          result = module.ci.record('focused-python-unit', [os.environ['RECONCILIATION_TEST_PYTHON'], '-B', '-m', 'unittest', 'discover', '-s', str(root / 'tests'), '-p', 'test_*.py', '-v'], timeout=180)
          print(module.ci.bounded(result.stdout))
          print(module.ci.bounded(result.stderr))
          PYUNIT
      - name: Source-bound observer contract tests with persisted safe diagnostics
        id: node
        run: |
          python3 -B - <<'PYNODE'
          import importlib.util, os
          from pathlib import Path
          root = Path(os.environ['RECONCILIATION_ROOT']).resolve()
          spec = importlib.util.spec_from_file_location('_reconciliation_ci_node', root / 'ci_package.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          result = module.ci.record('focused-node-observer-contract', ['node', '--test', str(root / 'tests/test_trace_binding.mjs')], timeout=120)
          print(module.ci.bounded(result.stdout))
          print(module.ci.bounded(result.stderr))
          PYNODE
      - name: Actual CPU container Studio import, native guard and fail-closed startup
        id: test
        run: python3 -B "$RECONCILIATION_ROOT/ci_package.py" test
      - name: Freeze exact tested manifest payload
        id: stage
        run: python3 -B "$RECONCILIATION_ROOT/ci_package.py" stage
      - name: Build new unique additive image with network-disabled build commands
        id: build
        run: python3 -B "$RECONCILIATION_ROOT/ci_package.py" build
      - name: Verify inherited and new source hashes and Secret Scan
        id: verify
        run: python3 -B "$RECONCILIATION_ROOT/ci_package.py" verify
      - name: Publish new GHCR tag without overwriting existing images
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B "$RECONCILIATION_ROOT/ci_package.py" publish
      - name: Persist bounded safe image build evidence
        if: always() && steps.checkout.outcome == 'success'
        env:
          RESULT_STEP_OUTCOMES: >-
            {"preflight":"${{ steps.preflight.outcome }}","guard":"${{ steps.guard.outcome }}","dependencies":"${{ steps.dependencies.outcome }}","unit":"${{ steps.unit.outcome }}","node":"${{ steps.node.outcome }}","test":"${{ steps.test.outcome }}","stage":"${{ steps.stage.outcome }}","build":"${{ steps.build.outcome }}","verify":"${{ steps.verify.outcome }}","publish":"${{ steps.publish.outcome }}"}
        run: python3 -B "$RECONCILIATION_ROOT/ci_package.py" persist

  verify-pull:
    needs: build
    if: needs.build.result == 'success' && needs.build.outputs.digest != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
      packages: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      RESULT_RUNNER_LABEL: ubuntu-24.04
      RESULT_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
      RESULT_PHASE: pull
      RESULT_PUBLISHED_TAG: ${{ needs.build.outputs.tag }}
      RESULT_PUBLISHED_DIGEST: ${{ needs.build.outputs.digest }}
      RECONCILIATION_ROOT: world-simulation-shorts-engine/recovery/render-path-reconciliation-v1
    steps:
      - name: Fresh independent runner checkout
        id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/world-engine-reconciliation-v1.yml
            /world-simulation-shorts-engine/recovery/**/*.py
            /world-simulation-shorts-engine/recovery/**/*.mjs
            /world-simulation-shorts-engine/recovery/**/*.json
            /world-simulation-shorts-engine/recovery/render-path-reconciliation-v1/**
            /world-simulation-shorts-engine/web/map_infographic_v1/*.mjs
      - name: Require free public runner and safe disk capacity
        id: preflight
        run: python3 -B "$RECONCILIATION_ROOT/ci_package.py" preflight
      - name: Pull immutable digest and verify actual image source hashes
        id: pull
        run: python3 -B "$RECONCILIATION_ROOT/ci_package.py" pull
      - name: Persist independent digest and portable nonsecret image proof
        if: always() && steps.checkout.outcome == 'success'
        env:
          RESULT_STEP_OUTCOMES: >-
            {"preflight":"${{ steps.preflight.outcome }}","pull":"${{ steps.pull.outcome }}"}
        run: python3 -B "$RECONCILIATION_ROOT/ci_package.py" persist
