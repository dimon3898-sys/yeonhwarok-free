name: WORLD ENGINE Korean 20s remaining CPU movie
on:
  push:
    branches: [recovery/korean-war-20s-resume-20261107]
    paths: ['.github/workflows/world-engine-kw20-movie-cpu-once.yml']
permissions:
  contents: read
  packages: read
  actions: read
concurrency:
  group: world-engine-kw20-movie-20261107
  cancel-in-progress: false
jobs:
  render-scene:
    if: >-
      github.run_attempt == 1 && github.event.repository.private == false &&
      github.repository == 'dimon3898-sys/yeonhwarok-free' &&
      github.event.before == 'cd504a4ea717ae9de2751c770fdc8018a3530331' &&
      github.event.head_commit.message == 'WORLD_ENGINE_KW20_MOVIE_CPU_20261107_A1'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {clip: 1, start: 0}
          - {clip: 1, start: 150}
          - {clip: 2, start: 0}
          - {clip: 2, start: 150}
    env:
      KW20_CLIP: ${{ matrix.clip }}
      KW20_START: ${{ matrix.start }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            world-simulation-shorts-engine/production/korean-war-20s-detail-v2
            world-simulation-shorts-engine/production/korean-war-20s-visual-v4
            world-simulation-shorts-engine/production/korean-war-20s-movie-v5
            world-simulation-shorts-engine/recovery/universal-presentation-v2
            world-simulation-shorts-engine/recovery/universal-data-pipeline-v1
            world-simulation-shorts-engine/recovery/codex-to-gcube-handoff-v1
            world-simulation-shorts-engine/recovery/studio-cold-start-v2
      - uses: actions/download-artifact@v4
        with:
          name: kw20-visual-42336598566
          run-id: 42336598566
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/kw20-previous
      - uses: actions/download-artifact@v4
        with:
          name: kw20-color-remaining-42336998246
          run-id: 42336998246
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/kw20-remaining
      - name: Restore exact candidate and cached frames without repeating source preparation
        run: |
          python3 - <<'PY'
          import os,zipfile,shutil
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          for name in ['previous','remaining']:
              prior=root/('kw20-'+name)
              with zipfile.ZipFile(prior/'KW20_DETAIL_EVIDENCE.zip') as z:z.extractall(prior/'pixels')
          prior=root/'kw20-previous'
          source=Path('world-simulation-shorts-engine/production/korean-war-20s-detail-v2/sources')
          with zipfile.ZipFile(prior/'KW20_PINNED_SOURCE_CROP.zip') as z:
              with z.open('korea_bmng_500m_native.png') as src,(source/'korea_bmng_500m_native.png').open('xb') as dst:shutil.copyfileobj(src,dst)
          target=Path('world-simulation-shorts-engine/production/korean-war-20s-visual-v4')
          for name in ['KOREAN_WAR_20S_PART_01.json','KOREAN_WAR_20S_PART_02.json','SOURCE_SEAL.json']:
              with (prior/name).open('rb') as src,(target/name).open('xb') as dst:shutil.copyfileobj(src,dst)
          PY
      - name: Reuse immutable software parent without a build
        run: |
          sudo python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('/etc/docker/daemon.json');d=json.loads(p.read_text()) if p.exists() else {}
          d.setdefault('features',{})['containerd-snapshotter']=True;d['max-download-attempts']=1
          p.write_text(json.dumps(d)+'\n')
          PY
          sudo systemctl restart docker
          docker pull ghcr.io/dimon3898-sys/world-simulation-shorts-engine@sha256:af3ad26a305c160a916ac231122a31824cbee4759338c044bab0d6c9dab1691a
      - name: Render only remaining frames in the original scene interval
        run: python3 -B world-simulation-shorts-engine/production/korean-war-20s-movie-v5/run_chunk_once.py
      - name: Preserve encoded scene or unfinished pixel evidence
        if: always()
        run: |
          if [ -d "${RUNNER_TEMP}/kw20-evidence" ]; then sudo chmod -R a+rX "${RUNNER_TEMP}/kw20-evidence"; fi
          python3 - <<'PY'
          import os,json,zipfile,hashlib,shutil
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'kw20-evidence';p.mkdir(exist_ok=True)
          out=p/'delivery';out.mkdir(exist_ok=True)
          success=(p/'CHUNK_RECEIPT.json').exists()
          start=int(os.environ['KW20_START'])
          keep={f'FRAME_{start:03d}.png',f'FRAME_{start+149:03d}.png',f'FRAME_{start:03d}.json',f'FRAME_{start+149:03d}.json'}
          with zipfile.ZipFile(out/'SCENE_EVIDENCE.zip','w',zipfile.ZIP_DEFLATED) as z:
              for f in p.rglob('*'):
                  if not f.is_file() or out in f.parents or f.suffix=='.mp4':continue
                  if not success or f.name in keep or f.name in ['RUN_RESULT.json','CHUNK_RECEIPT.json','PNG_SEQUENCE.json','CPU_PREVIEW_RESULT.json','FRAME_EVIDENCE.json','INSTALLED_SOURCE.json','CHECK_FAILED.json','REUSED_PREPARATION_RECEIPT.json']:
                      z.write(f,f.relative_to(p))
          for f in p.glob('*.mp4'):shutil.copy2(f,out/f.name)
          (out/'SHA256SUMS').write_text(''.join(hashlib.sha256(f.read_bytes()).hexdigest()+'  '+f.name+'\n' for f in sorted(out.iterdir()) if f.is_file()))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kw20-movie-${{ github.run_id }}-c${{ matrix.clip }}-s${{ matrix.start }}
          path: ${{ runner.temp }}/kw20-evidence/delivery/
          retention-days: 30
      - name: Remove only this disposable CPU container
        if: always()
        run: |
          if docker container inspect "we-kw20-${GITHUB_RUN_ID}" >/dev/null 2>&1; then docker rm -f "we-kw20-${GITHUB_RUN_ID}"; fi
