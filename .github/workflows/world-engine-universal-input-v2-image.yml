name: WORLD ENGINE common external input V2 image
on:
  push:
    branches: [fix/reference-6s-formal-admission-20261113]
    paths: ['.github/workflows/world-engine-universal-input-v2-image.yml']
permissions:
  contents: read
  packages: write
concurrency:
  group: world-engine-universal-input-v2-image
  cancel-in-progress: false
jobs:
  common-image:
    if: >-
      github.run_attempt == 1 && github.event.repository.private == false &&
      github.repository == 'dimon3898-sys/yeonhwarok-free' &&
      github.event.head_commit.message == 'WORLD_ENGINE_UNIVERSAL_INPUT_V2_A1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NVIDIA_VISIBLE_DEVICES: void
      GUARD: world-simulation-shorts-engine/release-guard
      TARGET: world-simulation-shorts-engine/recovery/universal-input-contract-v2
    steps:
      - name: Fetch common release policy from this exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .world-engine-guard-control
          persist-credentials: false
          sparse-checkout: |
            .github/actions/world-engine-release-guard
            world-simulation-shorts-engine/release-guard
      - name: Install mandatory common image publication gate
        uses: ./.world-engine-guard-control/.github/actions/world-engine-release-guard
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/
            /world-simulation-shorts-engine/release-guard/
            /world-simulation-shorts-engine/recovery/universal-input-contract-v2/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch exact sealed delta and preserve prior validation
        run: |
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          p=Path(os.environ['TARGET']);package=json.loads((p/'PACKAGE.json').read_bytes())
          decision=json.loads((p/'BUILD_DECISION.json').read_bytes())
          assert decision['status']=='BUILD_NECESSARY_AFTER_REMOTE_SAVE' and decision['externalDataExcluded']
          assert hashlib.sha256((p/'PACKAGE.json').read_bytes()).hexdigest()==decision['packageSHA256']
          for row in decision['validationEvidence']:
              assert hashlib.sha256(Path(row['path']).read_bytes()).hexdigest()==row['sha256']
          remote=subprocess.check_output(['git','ls-remote','origin','refs/heads/fix/reference-6s-formal-admission-20261113'],text=True).split()[0]
          assert remote==os.environ['GITHUB_SHA'], 'REMOTE_SAVE_OR_CONCURRENT_HEAD_CHANGED'
          paths=['/.github/workflows/','/world-simulation-shorts-engine/release-guard/','/'+str(p)+'/', '/world-simulation-shorts-engine/production/mongol-three-6s-20261114/']
          paths += ['/'+row['path'] for row in package['files']]
          subprocess.run(['git','sparse-checkout','set','--no-cone','--stdin'],input='\n'.join(paths)+'\n',text=True,check=True)
          policy=json.loads(Path(os.environ['GUARD']+'/REQUIRED_FIXES.json').read_bytes())['reviewedExternalHistoryV2']
          for row in policy['evidence']:
              assert hashlib.sha256(Path(row['path']).read_bytes()).hexdigest()==row['sha256']
          print('Remote evidence hashes reused; no previous suite or video rerun')
          PY
          python -m pip install --disable-pip-version-check PyYAML==6.0.3
          python -B "${GUARD}/audit_workflows.py" --repo . --output "${WORLD_ENGINE_GUARD_EVIDENCE}/WORKFLOW_COVERAGE.json"
      - name: Enable existing disposable builder compatibility
        run: |
          sudo python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('/etc/docker/daemon.json');d=json.loads(p.read_text()) if p.exists() else {}
          d.setdefault('features',{})['containerd-snapshotter']=True;d['max-download-attempts']=1
          p.write_text(json.dumps(d)+'\n')
          PY
          sudo systemctl restart docker
      - name: Build exact delta using existing formal Dockerfile generator
        run: |
          set -euo pipefail
          python -B "${GUARD}/package_delta.py" "${TARGET}/PACKAGE.json" "${RUNNER_TEMP}/common-image-context"
          IMAGE="ghcr.io/dimon3898-sys/world-simulation-shorts-engine:universal-input-v2-${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}"
          if docker manifest inspect "${IMAGE}" >/dev/null 2>&1; then echo IMMUTABLE_TAG_EXISTS; exit 1; fi
          docker build --platform linux/amd64 --label "org.opencontainers.image.revision=${GITHUB_SHA}" --label 'org.opencontainers.image.source=https://github.com/dimon3898-sys/yeonhwarok-free' -t "${IMAGE}" "${RUNNER_TEMP}/common-image-context"
          printf '%s\n' "${IMAGE}" > "${RUNNER_TEMP}/common-image-tag"
      - name: Actual-image external data and three Controller Worker requests without GPU
        timeout-minutes: 10
        run: |
          set -euo pipefail
          IMAGE="$(cat "${RUNNER_TEMP}/common-image-tag")"
          INPUTS="${GITHUB_WORKSPACE}/world-simulation-shorts-engine/production/mongol-three-6s-20261114"
          sudo chown -R 0:0 "${INPUTS}/data"
          docker run --rm -i --network none --read-only --user 1000:1000 --cap-drop ALL --security-opt no-new-privileges --tmpfs /contract-gate:rw,nosuid,nodev,size=1g,mode=700,uid=1000,gid=1000 --tmpfs /tmp:rw,nosuid,nodev,size=128m,mode=1777 -e NVIDIA_VISIBLE_DEVICES=void -e PYTHONDONTWRITEBYTECODE=1 -e WORLD_ENGINE_DATA_ROOT=/reviewed-data -e WORLD_ENGINE_DATA_CATALOG_SHA256=06cdf5e6509b3775c40afe307e95d77524da3fbb61b095987c9488c6e5d59822 --mount "type=bind,src=${INPUTS}/data,dst=/reviewed-data,readonly" --mount "type=bind,src=${INPUTS},dst=/reviewed-inputs,readonly" --mount "type=bind,src=${GITHUB_WORKSPACE}/${TARGET}/probe_image.py,dst=/contract-probe.py,readonly" --entrypoint /usr/bin/python3 "${IMAGE}" -I -B /contract-probe.py > "${WORLD_ENGINE_GUARD_EVIDENCE}/EXTERNAL_INPUT_IMAGE_TRANSPORT.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          x=json.loads((Path(os.environ['WORLD_ENGINE_GUARD_EVIDENCE'])/'EXTERNAL_INPUT_IMAGE_TRANSPORT.json').read_bytes())
          assert x['status']=='PASS_ACTUAL_IMAGE_EXTERNAL_DATA_CONTROLLER_WORKER' and x['GPUExecutions']==0
          assert len(x['inputs'])==3 and all(r['workerInputBytesUnchanged'] for r in x['inputs'])
          PY
      - name: Verify actual image with unchanged mandatory protection gates
        run: |
          python -B "${GUARD}/control.py" verify --image "$(cat "${RUNNER_TEMP}/common-image-tag")" --evidence "${WORLD_ENGINE_GUARD_EVIDENCE}"
      - name: Publish through common image interlock and confirm remote digest
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker push "$(cat "${RUNNER_TEMP}/common-image-tag")"
          docker logout ghcr.io
      - name: Preserve exact image evidence as immutable artifact
        if: always()
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          out=Path(os.environ['WORLD_ENGINE_GUARD_EVIDENCE']);out.mkdir(exist_ok=True)
          (out/'RUN.json').write_text(json.dumps({'runId':os.environ['GITHUB_RUN_ID'],'buildCommit':os.environ['GITHUB_SHA'],'releaseApproved':(out/'RELEASE_APPROVAL.json').exists(),'GPUExecutions':0,'branchMutation':False})+'\n')
          PY
      - name: Upload immutable evidence for interruption recovery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: common-input-v2-image-${{ github.run_id }}
          path: ${{ runner.temp }}/world-engine-release-evidence/
          if-no-files-found: warn
          retention-days: 90
