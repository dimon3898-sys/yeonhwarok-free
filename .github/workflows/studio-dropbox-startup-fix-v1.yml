name: Dropbox fixed startup and actual free CPU recovery proof
on:
  push:
    branches: [development/dropbox-startup-fix-20261018]
    paths:
      - .github/workflows/studio-dropbox-startup-fix-v1.yml
      - world-simulation-shorts-engine/recovery/studio-dropbox-startup-fix-v1/**
      - '!world-simulation-shorts-engine/recovery/studio-dropbox-startup-fix-v1/runs/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: studio-dropbox-startup-fix-${{ github.ref }}
  cancel-in-progress: false
jobs:
  cpu-recovery:
    if: github.repository == 'dimon3898-sys/yeonhwarok-free' && github.event.repository.private == false && github.ref == 'refs/heads/development/dropbox-startup-fix-20261018'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      RESULT_RUNNER_LABEL: ubuntu-24.04
      RESULT_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
      FIX_ROOT: world-simulation-shorts-engine/recovery/studio-dropbox-startup-fix-v1
    steps:
      - name: Preserve original sources and load only additive proof adapter
        id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/studio-dropbox-startup-fix-v1.yml
            /world-simulation-shorts-engine/recovery/studio-dropbox-startup-fix-v1/**
            /world-simulation-shorts-engine/recovery/studio-dropbox-mobile-v1/**
            /world-simulation-shorts-engine/recovery/studio-dropbox-offline-v1/**
            /world-simulation-shorts-engine/recovery/studio-https-bootstrap-v1/ci_package.py
      - name: Focused startup correction tests without provider credentials
        run: python3 -B -m unittest discover -s "$FIX_ROOT/tests" -p 'test_*.py' -v
      - name: Free runner and frozen source protection
        id: preflight
        run: python3 -B "$FIX_ROOT/proof.py" preflight
      - name: Pinned default Secret Scan of additive source and workflow
        id: scan
        run: python3 -B "$FIX_ROOT/proof.py" scan
      - name: Pull just the existing immutable image and verify source manifests
        id: pull
        if: github.event_name == 'workflow_dispatch'
        run: python3 -B "$FIX_ROOT/proof.py" pull
      - name: Exact CPU container failure before and import success after fixed cwd
        if: github.event_name == 'workflow_dispatch'
        run: python3 -B "$FIX_ROOT/proof.py" startup
      - name: One actual offline refresh upload download and fresh checkpoint restore
        id: external
        if: github.event_name == 'workflow_dispatch'
        env:
          WORLD_ENGINE_STUDIO_BACKUP_KEY: ${{ secrets.WORLD_ENGINE_STUDIO_BACKUP_KEY }}
          WORLD_ENGINE_STUDIO_BACKUP_DROPBOX_APP_KEY: ${{ secrets.WORLD_ENGINE_STUDIO_BACKUP_DROPBOX_APP_KEY }}
          WORLD_ENGINE_STUDIO_BACKUP_DROPBOX_APP_SECRET: ${{ secrets.WORLD_ENGINE_STUDIO_BACKUP_DROPBOX_APP_SECRET }}
          WORLD_ENGINE_STUDIO_BACKUP_DROPBOX_REFRESH_TOKEN: ${{ secrets.WORLD_ENGINE_STUDIO_BACKUP_DROPBOX_REFRESH_TOKEN }}
        run: python3 -B "$FIX_ROOT/proof.py" external
      - name: Persist allowlisted actual result without raw provider output
        if: always() && github.event_name == 'workflow_dispatch' && steps.checkout.outcome == 'success'
        env:
          RESULT_STEP_OUTCOMES: >-
            {"preflight":"${{ steps.preflight.outcome }}","scan":"${{ steps.scan.outcome }}","pull":"${{ steps.pull.outcome }}","external":"${{ steps.external.outcome }}"}
        run: python3 -B "$FIX_ROOT/proof.py" persist
