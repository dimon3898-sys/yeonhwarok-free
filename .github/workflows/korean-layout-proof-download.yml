name: Download unchanged Korean layout proof PNG

'on':
  push:
    branches: ['proof-artifact-korean-layout-97ff13b2']

permissions:
  contents: write

jobs:
  publish-existing-png:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout existing PNG only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          sparse-checkout: .proof-artifacts/korean-layout-stage3
          fetch-depth: 1
      - name: Verify existing PNG bytes
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' '97ff13b2fa962680d7e8a2497c4e37f2f58bb031d5f16b775d6d541dc20b7307' '.proof-artifacts/korean-layout-stage3/AFTER.png' | sha256sum --check
      - name: Preserve downloadable Actions artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Korean-layout-Stage3-AFTER-PNG
          path: .proof-artifacts/korean-layout-stage3/AFTER.png
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Publish PNG Release Asset for phone download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PROOF_TAG: proof-korean-layout-stage3-97ff13b2-20261011
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' 'Unchanged existing MAP_INFOGRAPHIC_RENDERER_V1 Stage 3 Korean layout proof.' '1080x1920 lossless PNG. No renderer, image, or visual changes and no rerender.' 'SHA-256: 97ff13b2fa962680d7e8a2497c4e37f2f58bb031d5f16b775d6d541dc20b7307' > /tmp/proof-download-notes.txt
          timeout 120 gh release create "$PROOF_TAG" '.proof-artifacts/korean-layout-stage3/AFTER.png' --target "$GITHUB_SHA" --title 'Stage 3 Korean Layout — existing AFTER.png download' --notes-file /tmp/proof-download-notes.txt --prerelease --latest=false
