name: WORLD ENGINE frame1 incident focused CPU
on:
  push:
    branches: [recovery/capture-durable-20261105]
    paths: ['.github/workflows/world-engine-incident-frame1-cpu.yml']
permissions:
  contents: write
  packages: read
concurrency:
  group: world-engine-incident-frame1-cpu
  cancel-in-progress: false
jobs:
  focused-cpu:
    if: >-
      github.run_attempt == 1 && github.event.repository.private == false &&
      startsWith(github.event.head_commit.message, 'WORLD_ENGINE_INCIDENT_CPU_')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            world-simulation-shorts-engine/recovery/capture-stall-review-v1
            world-simulation-shorts-engine/recovery/codex-to-gcube-handoff-v1
            world-simulation-shorts-engine/recovery/universal-presentation-v2
            world-simulation-shorts-engine/recovery/studio-cold-start-v2
      - name: Preserved image storage
        run: |
          sudo python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('/etc/docker/daemon.json');d=json.loads(p.read_text()) if p.exists() else {}
          d.setdefault('features',{})['containerd-snapshotter']=True;d['max-download-attempts']=1
          p.write_text(json.dumps(d)+'\n')
          PY
          sudo systemctl restart docker
          docker pull ghcr.io/dimon3898-sys/world-simulation-shorts-engine@sha256:534e5afd33e73b9d3f3e49db3f4a7dc63a1ee25a91457611f2d4b4fcb00e1e4c
      - name: New incident regressions only
        run: python3 -B world-simulation-shorts-engine/recovery/capture-stall-review-v1/tests/run_incident_cpu.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: incident-frame1-${{ github.run_id }}
          path: ${{ runner.temp }}/incident-evidence
          retention-days: 14
      - name: Preserve evidence
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json,os,zipfile,hashlib
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'incident-evidence'
          if not p.exists():raise SystemExit(0)
          files=[f for f in p.rglob('*') if f.is_file()]
          (p/'SHA256.json').write_text(json.dumps([{'path':str(f.relative_to(p)),'bytes':f.stat().st_size,'sha256':hashlib.sha256(f.read_bytes()).hexdigest()} for f in files],indent=2)+'\n')
          with zipfile.ZipFile(p.parent/'INCIDENT_CPU_EVIDENCE.zip','x',zipfile.ZIP_DEFLATED) as z:
              for f in files+[p/'SHA256.json']:z.write(f,f.relative_to(p))
          (p.parent/'incident-notes.txt').write_text('New frame1 CPU regression evidence. No GPU, no image build, no complete MP4, no reference-quality approval.\n')
          PY
          if [ -f "$RUNNER_TEMP/INCIDENT_CPU_EVIDENCE.zip" ]; then
            gh release create "incident-frame1-cpu-${GITHUB_RUN_ID}" "$RUNNER_TEMP/INCIDENT_CPU_EVIDENCE.zip" --target "$GITHUB_SHA" --title "Frame1 incident CPU ${GITHUB_RUN_ID}" --notes-file "$RUNNER_TEMP/incident-notes.txt"
          fi
      - name: Remove disposable CPU container
        if: always()
        run: |
          if docker container inspect "we-incident-cpu-${GITHUB_RUN_ID}" >/dev/null 2>&1; then docker rm -f "we-incident-cpu-${GITHUB_RUN_ID}"; fi
