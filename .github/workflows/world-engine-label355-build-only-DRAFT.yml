name: WORLD ENGINE label355 candidate build DRAFT (disabled)
# Isolated, non-executable candidate workflow. No GHCR publication or GPU.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: world-engine-label355-build-only
  cancel-in-progress: false
jobs:
  candidate-build:
    # Deliberately disabled: live cost/allowance and capacity evidence plus reviewed
    # installed-image verifier are missing. Never remove without a separate gate.
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BASE_SHA: 9693132920bb269b6b6fefa1ed5ecd1e9e7e3237
      PARENT: ghcr.io/dimon3898-sys/world-simulation-shorts-engine@sha256:9378a86d81341172b48910606d44ca389afd28f5e96b615ceec6fa84321b62da
      PKG: world-simulation-shorts-engine/recovery/label-packaging-v1/package_labels.py
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_SHA }}
          persist-credentials: false
      - name: Fail closed on unapproved billing gate
        run: |
          echo "BLOCKED: fresh billing/allowance attestation required"
          exit 1
      # Only after billing gate approval: use the proven G2 preflight pattern
      # (registry manifest compressed bytes * 4 + 8GiB reserve, DockerRootDir free
      # measured on this runner, fixed parent digest verified before any pull).
      - name: Prepare exact 355-source context without rebuilding prior PASS
        if: ${{ false }}
        run: |
          python3 -B "$PKG" prepare --repo "$GITHUB_WORKSPACE" --context "$RUNNER_TEMP/label355-context"
          python3 -B "$PKG" verify --repo "$GITHUB_WORKSPACE" --context "$RUNNER_TEMP/label355-context"
      - name: One candidate pull and offline build only
        if: ${{ false }}
        run: |
          docker pull "$PARENT"
          docker build --network none --pull=false -t world-engine-label355:unpublished "$RUNNER_TEMP/label355-context"
      # Installed-image verification remains unimplemented: DO NOT enable the
      # build until an actual verifier checks all 355 hashes, OCI entrypoint,
      # bootstrap chain and UID1000 file access and preserves evidence.
      # No docker login/push, registry writes, GPU, or main branch mutations.
