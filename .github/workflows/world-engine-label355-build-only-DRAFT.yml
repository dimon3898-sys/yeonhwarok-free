name: WORLD ENGINE label355 candidate build DRAFT (disabled)
# No automatic trigger, no GHCR push, no GPU. Explicitly disabled pending gates.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: world-engine-label355-build-only
  cancel-in-progress: false
jobs:
  candidate-build:
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PARENT: ghcr.io/dimon3898-sys/world-simulation-shorts-engine@sha256:9378a86d81341172b48910606d44ca389afd28f5e96b615ceec6fa84321b62da
      PKG: world-simulation-shorts-engine/recovery/label-packaging-v1/package_labels.py
      VERIFIER: world-simulation-shorts-engine/recovery/label-packaging-v1/verify_installed_355.py
      PREFLIGHT: world-simulation-shorts-engine/recovery/label-packaging-v1/preflight_build_only.py
      ROOT: /opt/world-engine-handoffs/studio-capture-diagnostics-g2-v1/repo
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fresh cost and daemon capacity gate (disabled until billing attestation)
        id: preflight
        run: |
          mkdir -p "$RUNNER_TEMP/label355-evidence"
          python3 -B "$PREFLIGHT" --out "$RUNNER_TEMP/label355-evidence/PREFLIGHT.json" --billing-attestation "$RUNNER_TEMP/live-billing-attestation.json"
      # After approval only: reuse proven G2 preflight method with current
      # parent digest and measured daemon free space, not historical numbers.
      - name: Prepare exact 355-source context
        if: ${{ false }}
        run: |
          python3 -B "$PKG" prepare --repo "$GITHUB_WORKSPACE" --context "$RUNNER_TEMP/label355-context"
          python3 -B "$PKG" verify --repo "$GITHUB_WORKSPACE" --context "$RUNNER_TEMP/label355-context"
      - name: One pull and one offline candidate build
        if: ${{ false }}
        run: |
          docker pull "$PARENT"
          docker build --network none --pull=false -t world-engine-label355:unpublished "$RUNNER_TEMP/label355-context"
      - name: Inspect OCI config and exact ENTRYPOINT before container validation
        if: ${{ false }}
        run: |
          docker image inspect world-engine-label355:unpublished > "$RUNNER_TEMP/label355-oci.json"
          python3 - <<'PY'
          import json,os
          p=json.load(open(os.environ['RUNNER_TEMP']+'/label355-oci.json'))[0]
          e=json.load(open('world-simulation-shorts-engine/recovery/label-packaging-v1/evidence/CONTEXT_PLAN.json'))
          c=p['Config']
          assert c['Entrypoint']==e['entrypoint'],'OCI_ENTRYPOINT_MISMATCH'
          assert c.get('Cmd') is None,'OCI_CMD_CHANGED'
          assert c.get('User') in ('','0','root','0:0'),'OCI_USER_CHANGED'
          print('OCI_DECLARED_CONFIG_MATCH')
          PY
      - name: Verify 355 installed files and UID1000 without GPU
        if: ${{ false }}
        run: |
          mkdir -p "$RUNNER_TEMP/label355-evidence"
          chmod 0777 "$RUNNER_TEMP/label355-evidence"
          docker run --rm --network none --read-only --user 1000:1000 \
            --mount "type=bind,src=$GITHUB_WORKSPACE/$VERIFIER,dst=/verify.py,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/world-simulation-shorts-engine/recovery/label-packaging-v1/evidence/CONTEXT_PLAN.json,dst=/expected.json,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/label355-evidence,dst=/evidence" \
            --entrypoint /usr/bin/python3 world-engine-label355:unpublished \
            -I -B /verify.py --root "$ROOT" --expected /expected.json --out /evidence/INSTALLED_RESULT.json
      - name: Hash bounded safe evidence (no remote push)
        if: always() && !cancelled()
        continue-on-error: true
        run: |
          python3 -B world-simulation-shorts-engine/recovery/label-packaging-v1/backup_build_evidence.py --evidence "$RUNNER_TEMP/label355-evidence" --index "$RUNNER_TEMP/label355-evidence/SAFE_INDEX.json"
      - name: Preserve bounded safe evidence on failure
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: world-engine-label355-safe-${{ github.run_id }}
          path: ${{ runner.temp }}/label355-evidence/
          if-no-files-found: warn
          retention-days: 1
          compression-level: 9
      # Artifact is temporary; permanent recovery-branch evidence backup is NOT yet connected.
      # No docker login, docker push, registry write, GPU, retry, or main change.
