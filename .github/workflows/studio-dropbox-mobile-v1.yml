name: WORLD ENGINE mobile Dropbox connection and free recovery proof

on:
  push:
    branches: [development/dropbox-mobile-connect-v1-20261018]
    paths:
      - .github/workflows/studio-dropbox-mobile-v1.yml
      - world-simulation-shorts-engine/recovery/studio-dropbox-mobile-v1/**
      - '!world-simulation-shorts-engine/recovery/studio-dropbox-mobile-v1/runs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studio-dropbox-mobile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cpu-mobile:
    if: github.repository == 'dimon3898-sys/yeonhwarok-free' && github.event.repository.private == false && github.ref == 'refs/heads/development/dropbox-mobile-connect-v1-20261018'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      RESULT_RUNNER_LABEL: ubuntu-24.04
      RESULT_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
      MOBILE_ROOT: world-simulation-shorts-engine/recovery/studio-dropbox-mobile-v1
    steps:
      - name: Fetch additive candidate and SHA-pinned old proof helper
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/studio-dropbox-mobile-v1.yml
            /world-simulation-shorts-engine/recovery/studio-dropbox-mobile-v1/**
            /world-simulation-shorts-engine/recovery/studio-dropbox-offline-v1/**
            /world-simulation-shorts-engine/recovery/studio-https-bootstrap-v1/ci_package.py
      - name: Focused proof safety tests without credentials or provider calls
        run: python3 -B -m unittest discover -s "$MOBILE_ROOT/tests" -p 'test_*.py' -v
      - name: Require free public standard runner and storage budget
        run: python3 -B "$MOBILE_ROOT/proof_ci.py" preflight
      - name: Scan only additive mobile source and workflow using pinned scanner
        run: python3 -B "$MOBILE_ROOT/proof_ci.py" scan
      - name: Pull existing immutable image and verify original source and protected parent
        run: python3 -B "$MOBILE_ROOT/proof_ci.py" pull
      - name: CPU-only Node contract mobile Chromium and sealed-box interoperability
        run: python3 -B "$MOBILE_ROOT/proof_ci.py" ui

  recovery-proof:
    needs: cpu-mobile
    if: needs.cpu-mobile.result == 'success' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      RESULT_RUNNER_LABEL: ubuntu-24.04
      RESULT_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
      MOBILE_ROOT: world-simulation-shorts-engine/recovery/studio-dropbox-mobile-v1
    steps:
      - name: Independent checkout on fresh standard CPU runner
        id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/studio-dropbox-mobile-v1.yml
            /world-simulation-shorts-engine/recovery/studio-dropbox-mobile-v1/**
            /world-simulation-shorts-engine/recovery/studio-dropbox-offline-v1/**
            /world-simulation-shorts-engine/recovery/studio-https-bootstrap-v1/ci_package.py
      - name: Require free public standard runner and storage budget
        id: preflight
        run: python3 -B "$MOBILE_ROOT/proof_ci.py" preflight
      - name: Check additive source before binding any Secret
        id: scan
        run: python3 -B "$MOBILE_ROOT/proof_ci.py" scan
      - name: Independent immutable pull and source dependency protection
        id: pull
        run: python3 -B "$MOBILE_ROOT/proof_ci.py" pull
      - name: Existing real offline refresh metadata access and encrypted fresh restore
        id: external
        env:
          WORLD_ENGINE_STUDIO_BACKUP_KEY: ${{ secrets.WORLD_ENGINE_STUDIO_BACKUP_KEY }}
          WORLD_ENGINE_STUDIO_BACKUP_DROPBOX_APP_KEY: ${{ secrets.WORLD_ENGINE_STUDIO_BACKUP_DROPBOX_APP_KEY }}
          WORLD_ENGINE_STUDIO_BACKUP_DROPBOX_APP_SECRET: ${{ secrets.WORLD_ENGINE_STUDIO_BACKUP_DROPBOX_APP_SECRET }}
          WORLD_ENGINE_STUDIO_BACKUP_DROPBOX_REFRESH_TOKEN: ${{ secrets.WORLD_ENGINE_STUDIO_BACKUP_DROPBOX_REFRESH_TOKEN }}
        run: python3 -B "$MOBILE_ROOT/proof_ci.py" external
      - name: Persist only allowlisted proof in new candidate namespace
        if: always() && steps.checkout.outcome == 'success'
        env:
          RESULT_STEP_OUTCOMES: >-
            {"preflight":"${{ steps.preflight.outcome }}","scan":"${{ steps.scan.outcome }}","pull":"${{ steps.pull.outcome }}","external":"${{ steps.external.outcome }}"}
        run: python3 -B "$MOBILE_ROOT/proof_ci.py" persist
