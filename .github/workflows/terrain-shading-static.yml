name: Frozen Terrain Shading RTX4080S static release

on:
  push:
    branches: ['release/map-renderer-v1-terrain-shading-*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: terrain-shading-static-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'dimon3898-sys/yeonhwarok-free'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      IMAGE: ghcr.io/dimon3898-sys/world-simulation-shorts-engine
      APP: world-simulation-shorts-engine
      RELEASE: world-simulation-shorts-engine/deployment/gcube/gate1_static
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install exact resource manager for packaging
        timeout-minutes: 4
        run: |
          set -euo pipefail
          cd cinematic-world-map
          timeout 180 npm ci --strict-ssl=true --ignore-scripts
      - name: Freeze existing Software D-final and native DEM bytes
        timeout-minutes: 2
        run: |
          set -euo pipefail
          timeout 60 python "$RELEASE/package_terrain_shading.py" --proof "$RELEASE/frozen_terrain" --output /tmp/gate1-static-context
          tag=$(python -c 'import json; print(json.load(open("/tmp/gate1-static-context/bundle/manifest.json"))["tag"])')
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "STAGE SOURCE_FROZEN PASS"
      - name: Authenticate registry using Actions package permission
        env:
          PUBLISH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$PUBLISH_TOKEN" | timeout 30 docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Enforce new immutable tag
        run: |
          set -euo pipefail
          if timeout 30 docker manifest inspect "$IMAGE:$TAG" >/dev/null 2>&1; then
            echo 'Immutable tag already exists. Refusing overwrite.'
            exit 1
          fi
      - name: Build dedicated container
        timeout-minutes: 12
        run: |
          set -euo pipefail
          echo "STAGE CONTAINER_BUILD START $(date -u +%FT%TZ)"
          timeout 660 docker build --progress=plain -t "$IMAGE:$TAG" /tmp/gate1-static-context
          echo "STAGE CONTAINER_BUILD PASS $(date -u +%FT%TZ)"
      - name: Focused contracts and desktop/mobile download
        timeout-minutes: 5
        run: |
          set -euo pipefail
          mkdir -p /tmp/gate1-release-evidence
          export STATIC_PROOF_TEST_BUNDLE=/opt/gate1-static/bundle
          export STATIC_PROOF_TEST_BASELINE=/work/$RELEASE/frozen_terrain
          export STATIC_PROOF_TEST_LEGACY_BASELINE=/work/$RELEASE/frozen
          export STATIC_PROOF_TEST_EVIDENCE_ROOT=/work/$RELEASE/frozen
          export STATIC_PROOF_PLAYWRIGHT_PACKAGE=/opt/world-engine/cinematic-world-map/package.json
          common=(--rm --entrypoint python -v "$GITHUB_WORKSPACE:/work:ro" -e STATIC_PROOF_TEST_BUNDLE -e STATIC_PROOF_TEST_BASELINE -e STATIC_PROOF_TEST_LEGACY_BASELINE -e STATIC_PROOF_TEST_EVIDENCE_ROOT -e STATIC_PROOF_PLAYWRIGHT_PACKAGE)
          timeout 90 docker run "${common[@]}" "$IMAGE:$TAG" "/work/$RELEASE/test_release.py" 2>&1 | tee /tmp/gate1-release-evidence/contracts.log
          timeout 80 docker run "${common[@]}" "$IMAGE:$TAG" "/work/$RELEASE/browser_fixture.py" 2>&1 | tee /tmp/gate1-release-evidence/browser-download.log
          timeout 30 docker run --rm --entrypoint node -v "$GITHUB_WORKSPACE:/work:ro" "$IMAGE:$TAG" "/work/$RELEASE/test_capability.mjs" | tee /tmp/gate1-release-evidence/capabilities.log
          timeout 60 docker run "${common[@]}" "$IMAGE:$TAG" "/work/$RELEASE/test_bootstrap.py" 2>&1 | tee /tmp/gate1-release-evidence/bootstrap.log
          timeout 30 docker run --rm --entrypoint node -v "$GITHUB_WORKSPACE:/work:ro" "$IMAGE:$TAG" "/work/$RELEASE/test_diagnostic.mjs" | tee /tmp/gate1-release-evidence/diagnostic.log
      - name: Identical factory single-frame software smoke (not NVIDIA validation)
        timeout-minutes: 4
        run: |
          set -euo pipefail
          chmod 0777 /tmp/gate1-release-evidence
          timeout 180 docker run --rm --user 1000:1000 --entrypoint python -v /tmp/gate1-release-evidence:/evidence "$IMAGE:$TAG" -c 'import os,pwd,subprocess,sys; sys.path.insert(0,"/opt/gate1-static"); from bootstrap import prepare_user_environment; e=prepare_user_environment(pwd.getpwuid(os.getuid()),"/tmp/gate1-ci-runtime"); subprocess.run(["node","/opt/gate1-static/worker.mjs","validate-software","/evidence/software-validation"],env=e,check=True,timeout=150)'
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/gate1-release-evidence/software-validation')
          d=json.loads((p/'diagnostic.json').read_text())
          assert d['runtime_profile']=='SOFTWARE_TEST_ONLY'
          assert d['frame_count']==1
          assert d['output_resolution']==[1080,1920]
          assert d['renderer_source_hash']=='e0108a8bf3cb3828529b9077925b9429455dbccd2c695f797f2578ac904b067d'
          assert d['peak_memory']=='UNKNOWN'
          assert d['capability']['actualPixelDraw'] and d['capability']['webgl2']
          assert (p/'SOFTWARE_TEST_ONLY.png').is_file()
          assert d['same_renderer_factory'] and d['gl_error']==0
          assert d['dem_hash']=='08a1b86fbe9c47a9495336e0e83d0bfdea014a4e5c7b36beaaa544aa283fd5a8'
          assert len(d['dem_source_hashes'])==4
          assert d['render_parameters']=={'dem':True,'correctedLight':True,'verticalExaggeration':2,'bakedSuppression':.1,'shadingCorrection':'OUTPUT'}
          assert d['renderer_evidence']['shadingParameters']['stage']=='OUTPUT'
          assert d['renderer_evidence']['demParameters']['verticalExaggeration']==2
          assert d['renderer_evidence']['heightSource']['sha256']==d['dem_hash']
          print('STAGE SOFTWARE_SAME_FACTORY_ONE_FRAME PASS; NVIDIA NOT RUN')
          PY
      - name: Real container boot/login/health/no GPU rejection
        timeout-minutes: 9
        run: |
          set -euo pipefail
          timeout 480 python "$RELEASE/container_preflight.py" "$IMAGE:$TAG" /tmp/gate1-release-evidence
      - name: Push only validated immutable image
        timeout-minutes: 5
        run: |
          set -euo pipefail
          timeout 240 docker push "$IMAGE:$TAG" | tee /tmp/gate1-release-evidence/push.log
      - name: Anonymous public pull and digest verification
        timeout-minutes: 5
        run: |
          set -euo pipefail
          mkdir -p /tmp/gate1-anonymous
          printf '{"auths":{}}\n' > /tmp/gate1-anonymous/config.json
          timeout 180 docker --config /tmp/gate1-anonymous pull "$IMAGE:$TAG" | tee /tmp/gate1-release-evidence/public-pull.log
          digest=$(docker image inspect "$IMAGE:$TAG" --format '{{index .RepoDigests 0}}')
          echo "$digest" | tee /tmp/gate1-release-evidence/DIGEST.txt
          cp /tmp/gate1-static-context/bundle/manifest.json /tmp/gate1-release-evidence/source-manifest.json
          echo "STAGE PUBLIC_PULL PASS; GPU VISUAL QUALITY NOT RUN"
      - name: Preserve failure and release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: terrain-shading-static-release-evidence
          path: /tmp/gate1-release-evidence
          if-no-files-found: warn
