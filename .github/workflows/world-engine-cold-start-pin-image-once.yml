name: WORLD ENGINE cold-start pin repair image
on:
  push:
    branches: [fix/cold-start-pins-20261108]
    paths: ['.github/workflows/world-engine-cold-start-pin-image-once.yml']
permissions:
  contents: write
  packages: write
concurrency:
  group: world-engine-cold-start-pin-20261108
  cancel-in-progress: false
defaults:
  run:
    shell: bash --noprofile --norc -e -o pipefail {0}
jobs:
  package-image:
    if: >-
      github.run_attempt == 1 &&
      github.repository == 'dimon3898-sys/yeonhwarok-free' &&
      github.event.repository.private == false &&
      github.event.before == 'b200ac5a2bd1cf630d038d12dedae01adf6e8a37' &&
      github.event.head_commit.message == 'WORLD_ENGINE_COLD_START_PIN_IMAGE_20261108_A1'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Fetch common release policy from this exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .world-engine-guard-control
          persist-credentials: false
          sparse-checkout: |
            .github/actions/world-engine-release-guard
            world-simulation-shorts-engine/release-guard
      - name: Install mandatory common image publication gate
        uses: ./.world-engine-guard-control/.github/actions/world-engine-release-guard
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
          sparse-checkout: |
            world-simulation-shorts-engine/production/cold-start-pin-fix-v14
            world-simulation-shorts-engine/recovery/reference-label-quality-v1
      - name: Select containerd store for preserved image
        run: |
          sudo python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('/etc/docker/daemon.json');d=json.loads(p.read_text()) if p.exists() else {}
          d.setdefault('features',{})['containerd-snapshotter']=True
          d['max-download-attempts']=1
          p.write_text(json.dumps(d)+'\n')
          PY
          sudo systemctl restart docker
      - name: Package one additive image and check actual CPU entrypoint
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COLD_START_EXPECTED_PARENT: 'b200ac5a2bd1cf630d038d12dedae01adf6e8a37'
        run: python3 -B world-simulation-shorts-engine/production/cold-start-pin-fix-v14/build_once.py
      - name: Preserve image preparation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cold-start-pin-image-${{ github.run_id }}
          path: ${{ runner.temp }}/cold-start-pin-evidence/
          if-no-files-found: warn
          retention-days: 90
# CPU packaging and actual ENTRYPOINT to intentional missing-owner boundary only. No service, capture, encoding, GPU, deployment start or stop.
# Old PASS and the focused CPU test PASS are reused without re-execution.
      - name: Preserve common release gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-guard-${{ github.job }}-${{ github.run_id }}
          path: ${{ runner.temp }}/world-engine-release-evidence/
          if-no-files-found: warn
          retention-days: 90
