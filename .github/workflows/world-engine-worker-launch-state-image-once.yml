name: WORLD ENGINE worker launch-state repair image
on:
  push:
    branches: [fix/worker-launch-state-20261108]
    paths: ['.github/workflows/world-engine-worker-launch-state-image-once.yml']
permissions:
  contents: write
  packages: write
concurrency:
  group: world-engine-worker-launch-state-20261108
  cancel-in-progress: false
defaults:
  run:
    shell: bash --noprofile --norc -e -o pipefail {0}
jobs:
  package-image:
    if: >-
      github.run_attempt == 1 &&
      github.repository == 'dimon3898-sys/yeonhwarok-free' &&
      github.event.repository.private == false &&
      github.event.before == '49067bc9d382c9337f9bcf608a8aee98bd7407e8' &&
      github.event.head_commit.message == 'WORLD_ENGINE_WORKER_LAUNCH_IMAGE_20261108_A1'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
          sparse-checkout: |
            world-simulation-shorts-engine/production/worker-launch-state-fix-v16
            world-simulation-shorts-engine/recovery/reference-label-quality-v1
      - name: Select containerd store for preserved image
        run: |
          sudo python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('/etc/docker/daemon.json');d=json.loads(p.read_text()) if p.exists() else {}
          d.setdefault('features',{})['containerd-snapshotter']=True
          d['max-download-attempts']=1
          p.write_text(json.dumps(d)+'\n')
          PY
          sudo systemctl restart docker
      - name: Package one additive image and check actual CPU entrypoint
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKER_LAUNCH_EXPECTED_PARENT: '49067bc9d382c9337f9bcf608a8aee98bd7407e8'
        run: python3 -B world-simulation-shorts-engine/production/worker-launch-state-fix-v16/build_once.py
      - name: Preserve image preparation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-launch-state-image-${{ github.run_id }}
          path: ${{ runner.temp }}/worker-launch-state-evidence/
          if-no-files-found: warn
          retention-days: 90
# CPU packaging and actual ENTRYPOINT to intentional missing-owner boundary only. No service, capture, encoding, GPU, deployment start or stop.
# Old PASS and the focused CPU test PASS are reused without re-execution.
