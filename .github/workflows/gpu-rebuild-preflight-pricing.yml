name: WORLD ENGINE GPU rebuild read-only price preflight

on:
  push:
    branches: [development/gpu-rebuild-preflight-20261018]
    paths:
      - .github/workflows/gpu-rebuild-preflight-pricing.yml
      - world-simulation-shorts-engine/recovery/gpu-rebuild-preflight-v1/pricing_readonly.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rebuild-readonly-price-${{ github.ref }}
  cancel-in-progress: false

jobs:
  readonly-price:
    if: github.repository == 'dimon3898-sys/yeonhwarok-free' && github.ref == 'refs/heads/development/gpu-rebuild-preflight-20261018'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: write
    env:
      PREFLIGHT_ROOT: world-simulation-shorts-engine/recovery/gpu-rebuild-preflight-v1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: development/gpu-rebuild-preflight-20261018
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /world-simulation-shorts-engine/recovery/gpu-rebuild-preflight-v1/pricing_readonly.py
      - name: Query official catalogue once with existing approved Secret
        env:
          GCUBE_ACCESS_TOKEN: ${{ secrets.GCUBE_ACCESS_TOKEN }}
        run: python3 -B "$PREFLIGHT_ROOT/pricing_readonly.py" "$PREFLIGHT_ROOT/price-runs/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/PRICING.json"
      - name: Persist only closed public-price fields
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re
          root = pathlib.Path(os.environ['PREFLIGHT_ROOT']) / 'price-runs' / (os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'])
          path = root / 'PRICING.json'
          raw = path.read_text(); value = json.loads(raw)
          assert value['method'] == 'GET' and value['requestLimit'] == 1
          assert value['workloadMutations'] == value['sshAttempts'] == value['paidOperations'] == 0
          assert not re.search(r'-----BEGIN .*PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{40,}|[?&](?:token|sig)=', raw)
          (root / 'SHA256SUMS').write_text(hashlib.sha256(path.read_bytes()).hexdigest() + '  PRICING.json\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse "$PREFLIGHT_ROOT/price-runs/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git diff --cached --check
          git commit -m 'docs(preflight): save read-only GPU catalogue quote [skip ci]'
          git push origin HEAD:development/gpu-rebuild-preflight-20261018
