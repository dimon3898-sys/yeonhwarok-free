name: WORLD ENGINE WebGL successful surface option restoration once
on:
  push:
    branches: [recovery/webgl-surface-restore-20261101]
    paths: ['.github/workflows/world-engine-surface-restore-once.yml']
permissions:
  contents: write
  packages: write
concurrency:
  group: world-engine-webgl-surface-restore-20261101
  cancel-in-progress: false
defaults:
  run:
    shell: bash --noprofile --norc -e -o pipefail {0}
jobs:
  surface-restore-once:
    if: >-
      github.run_attempt == 1 &&
      github.repository == 'dimon3898-sys/yeonhwarok-free' &&
      github.event.repository.private == false &&
      github.event.before == 'a4e02aad71d7b60225c3c22d8a81ef58a4d212fc' &&
      github.event.head_commit.message == 'WORLD_ENGINE_WEBGL_SURFACE_RESTORE_ONCE_20261101'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            world-simulation-shorts-engine/recovery/webgl-surface-restore-v1/
            world-simulation-shorts-engine/recovery/codex-to-gcube-handoff-v1/backend/GENERATED_SOURCE_MANIFEST.json
            world-simulation-shorts-engine/recovery/codex-to-gcube-handoff-v1/backend/profile_contract.mjs
            world-simulation-shorts-engine/recovery/codex-to-gcube-handoff-v1/presentation_runtime_vulkan.generated.mjs
            world-simulation-shorts-engine/recovery/codex-to-gcube-handoff-v1/capture_vulkan.generated.mjs
            world-simulation-shorts-engine/recovery/codex-to-gcube-handoff-v1/RUNTIME_SOURCE_MANIFEST.json
            world-simulation-shorts-engine/recovery/studio-cold-start-v2/bootstrap.py
            world-simulation-shorts-engine/recovery/studio-cold-start-v2/STARTUP_MANIFEST.json
            world-simulation-shorts-engine/recovery/label355-publication-v1/retain_label355_image.py
      - name: Build one successful-option overlay, retain and publish once
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -B world-simulation-shorts-engine/recovery/webgl-surface-restore-v1/build_once.py run
      - name: Preserve evidence after success or failure
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: world-engine-surface-restore-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/surface-restore-evidence/
            ${{ runner.temp }}/surface-restore-retention/*.json
            ${{ runner.temp }}/surface-restore-context/Dockerfile
          if-no-files-found: error
          retention-days: 1
# No GPU, renderer, compiler, prior PASS suite, deployment or existing tag mutation.
