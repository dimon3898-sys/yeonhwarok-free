name: WORLD ENGINE universal completion V2 CPU candidate image

on:
  workflow_dispatch:
  push:
    branches: [development/universal-integration-completion-20261019]
    paths:
      - .github/workflows/world-engine-universal-completion-v2.yml
      - world-simulation-shorts-engine/recovery/universal-integration-completion-v2/*.py
      - world-simulation-shorts-engine/recovery/universal-integration-completion-v2/*.mjs
      - world-simulation-shorts-engine/recovery/universal-integration-completion-v2/*.json
      - world-simulation-shorts-engine/recovery/universal-integration-completion-v2/Dockerfile

permissions:
  contents: read

concurrency:
  group: world-engine-completion-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'dimon3898-sys/yeonhwarok-free' && github.event.repository.private == false && github.ref == 'refs/heads/development/universal-integration-completion-20261019'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    outputs:
      tag: ${{ steps.publish.outputs.tag }}
      digest: ${{ steps.publish.outputs.digest }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      RESULT_RUNNER_LABEL: ubuntu-24.04
      RESULT_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
      RESULT_PHASE: build
      COMPLETION_ROOT: world-simulation-shorts-engine/recovery/universal-integration-completion-v2
    steps:
      - name: Checkout only manifested additive source and CI helper
        id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/world-engine-universal-completion-v2.yml
            /world-simulation-shorts-engine/recovery/universal-integration-v1/**
            /world-simulation-shorts-engine/recovery/universal-integration-completion-v2/**
            /world-simulation-shorts-engine/recovery/studio-https-bootstrap-v1/ci_package.py
            /world-simulation-shorts-engine/recovery/verified-front-data-v4-recovery/VIDEO_PLAN_80S.json
            /world-simulation-shorts-engine/recovery/verified-front-data-v4-recovery/FRONT_PROFILE.json
            /world-simulation-shorts-engine/recovery/verified-front-data-v4-recovery/FRONT_FILES.json
            /world-simulation-shorts-engine/recovery/verified-front-data-v4-recovery/PARENT_PLAN_80S.json
            /world-simulation-shorts-engine/recovery/verified-front-data-v4-recovery/generated/cmh-front-1950-12-31.geojson
            /world-simulation-shorts-engine/recovery/verified-front-data-v4-recovery/generated/cmh-front-1951-01-24.geojson
            /world-simulation-shorts-engine/recovery/verified-front-data-v4-recovery/generated/cmh-front-1951-02-28.geojson
            /world-simulation-shorts-engine/recovery/verified-front-data-v4-recovery/generated/cmh-front-1951-04-21.geojson
            /world-simulation-shorts-engine/recovery/verified-front-data-v4-recovery/generated/cmh-front-1951-05-19.geojson
            /world-simulation-shorts-engine/recovery/verified-front-data-v4-recovery/generated/cmh-front-1951-06-24.geojson
            /world-simulation-shorts-engine/recovery/verified-front-data-v4-recovery/generated/cmh-front-1951-11-12.geojson
            /world-simulation-shorts-engine/recovery/verified-front-data-v4-recovery/generated/cmh-front-1953-07-27.geojson
            /world-simulation-shorts-engine/recovery/universal-auto-video-v2/fixtures/NATIVE_PAYLOAD.json
      - name: Require public free standard runner and 20 GiB safe Docker headroom
        id: preflight
        run: python3 -B "$COMPLETION_ROOT/ci_package.py" preflight
      - name: Verify unique registry tag does not exist
        id: guard
        run: python3 -B "$COMPLETION_ROOT/ci_package.py" guard
      - name: Focused packaging CPU tests
        id: unit
        run: python3 -B -m unittest discover -s "$COMPLETION_ROOT/tests" -p test_completion_package.py -v
      - name: CPU container source protection and actual fail-closed startup
        id: test
        run: python3 -B "$COMPLETION_ROOT/ci_package.py" test
      - name: Freeze exact tested manifest payload
        id: stage
        run: python3 -B "$COMPLETION_ROOT/ci_package.py" stage
      - name: Build new unique additive image with network-disabled build commands
        id: build
        run: python3 -B "$COMPLETION_ROOT/ci_package.py" build
      - name: Verify inherited and new source hashes and Secret Scan
        id: verify
        run: python3 -B "$COMPLETION_ROOT/ci_package.py" verify
      - name: Publish new GHCR tag without overwriting existing images
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B "$COMPLETION_ROOT/ci_package.py" publish
      - name: Persist bounded safe image build evidence
        if: always() && steps.checkout.outcome == 'success'
        env:
          RESULT_STEP_OUTCOMES: >-
            {"preflight":"${{ steps.preflight.outcome }}","guard":"${{ steps.guard.outcome }}","unit":"${{ steps.unit.outcome }}","test":"${{ steps.test.outcome }}","stage":"${{ steps.stage.outcome }}","build":"${{ steps.build.outcome }}","verify":"${{ steps.verify.outcome }}","publish":"${{ steps.publish.outcome }}"}
        run: python3 -B "$COMPLETION_ROOT/ci_package.py" persist

  verify-pull:
    needs: build
    if: needs.build.result == 'success' && needs.build.outputs.digest != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
      packages: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      RESULT_RUNNER_LABEL: ubuntu-24.04
      RESULT_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
      RESULT_PHASE: pull
      RESULT_PUBLISHED_TAG: ${{ needs.build.outputs.tag }}
      RESULT_PUBLISHED_DIGEST: ${{ needs.build.outputs.digest }}
      COMPLETION_ROOT: world-simulation-shorts-engine/recovery/universal-integration-completion-v2
    steps:
      - name: Fresh independent runner checkout
        id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/world-engine-universal-completion-v2.yml
            /world-simulation-shorts-engine/recovery/universal-integration-v1/**
            /world-simulation-shorts-engine/recovery/universal-integration-completion-v2/**
            /world-simulation-shorts-engine/recovery/studio-https-bootstrap-v1/ci_package.py
            /world-simulation-shorts-engine/recovery/verified-front-data-v4-recovery/VIDEO_PLAN_80S.json
            /world-simulation-shorts-engine/recovery/verified-front-data-v4-recovery/FRONT_PROFILE.json
            /world-simulation-shorts-engine/recovery/verified-front-data-v4-recovery/FRONT_FILES.json
            /world-simulation-shorts-engine/recovery/verified-front-data-v4-recovery/PARENT_PLAN_80S.json
            /world-simulation-shorts-engine/recovery/verified-front-data-v4-recovery/generated/cmh-front-1950-12-31.geojson
            /world-simulation-shorts-engine/recovery/verified-front-data-v4-recovery/generated/cmh-front-1951-01-24.geojson
            /world-simulation-shorts-engine/recovery/verified-front-data-v4-recovery/generated/cmh-front-1951-02-28.geojson
            /world-simulation-shorts-engine/recovery/verified-front-data-v4-recovery/generated/cmh-front-1951-04-21.geojson
            /world-simulation-shorts-engine/recovery/verified-front-data-v4-recovery/generated/cmh-front-1951-05-19.geojson
            /world-simulation-shorts-engine/recovery/verified-front-data-v4-recovery/generated/cmh-front-1951-06-24.geojson
            /world-simulation-shorts-engine/recovery/verified-front-data-v4-recovery/generated/cmh-front-1951-11-12.geojson
            /world-simulation-shorts-engine/recovery/verified-front-data-v4-recovery/generated/cmh-front-1953-07-27.geojson
            /world-simulation-shorts-engine/recovery/universal-auto-video-v2/fixtures/NATIVE_PAYLOAD.json
      - name: Require free public runner and safe disk capacity
        id: preflight
        run: python3 -B "$COMPLETION_ROOT/ci_package.py" preflight
      - name: Pull immutable digest and verify actual image source hashes
        id: pull
        run: python3 -B "$COMPLETION_ROOT/ci_package.py" pull
      - name: Persist independent digest and portable nonsecret image proof
        if: always() && steps.checkout.outcome == 'success'
        env:
          RESULT_STEP_OUTCOMES: >-
            {"preflight":"${{ steps.preflight.outcome }}","pull":"${{ steps.pull.outcome }}"}
        run: python3 -B "$COMPLETION_ROOT/ci_package.py" persist
