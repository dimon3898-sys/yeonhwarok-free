name: WORLD ENGINE Dropbox GPU production adapter and restart proof
on:
  push:
    branches: [development/dropbox-gpu-production-20261018]
    paths:
      - .github/workflows/studio-dropbox-gpu-production-v1.yml
      - world-simulation-shorts-engine/recovery/studio-dropbox-gpu-production-v1/**
      - '!world-simulation-shorts-engine/recovery/studio-dropbox-gpu-production-v1/runs/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: studio-dropbox-gpu-production-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'dimon3898-sys/yeonhwarok-free' && github.event.repository.private == false && github.ref == 'refs/heads/development/dropbox-gpu-production-20261018'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
      packages: write
    outputs:
      tag: ${{ steps.publish.outputs.tag }}
      digest: ${{ steps.publish.outputs.digest }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      RESULT_RUNNER_LABEL: ubuntu-24.04
      RESULT_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
      RESULT_PHASE: build
      ROOT: world-simulation-shorts-engine/recovery/studio-dropbox-gpu-production-v1
    steps:
      - name: Load additive sources and unchanged pinned CI helpers
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        id: checkout
        with:
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/studio-dropbox-gpu-production-v1.yml
            /world-simulation-shorts-engine/recovery/studio-dropbox-gpu-production-v1/**
            /world-simulation-shorts-engine/recovery/studio-dropbox-offline-v1/**
            /world-simulation-shorts-engine/recovery/studio-https-bootstrap-v1/ci_package.py
      - name: Free runner source protection and unique tag
        id: preflight
        run: python3 -B "$ROOT/ci.py" preflight
      - name: Reject existing registry tag
        id: guard
        run: python3 -B "$ROOT/ci.py" guard
      - name: Stage exact payload and inspect immutable parent
        id: stage
        run: python3 -B "$ROOT/ci.py" stage
      - name: Build additive adapter without dependency changes
        id: build
        run: python3 -B "$ROOT/ci.py" build
      - name: UID 1000 CPU key permission child process and 240 minute policy tests
        id: test
        run: python3 -B "$ROOT/ci.py" test
      - name: Parent dependency payload and Secret Scan verification
        id: verify
        run: python3 -B "$ROOT/ci.py" verify
      - name: Publish tested unique candidate
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B "$ROOT/ci.py" publish
      - name: Save safe immutable build evidence
        if: always() && steps.checkout.outcome == 'success'
        env:
          RESULT_STEP_OUTCOMES: >-
            {"preflight":"${{ steps.preflight.outcome }}","guard":"${{ steps.guard.outcome }}","stage":"${{ steps.stage.outcome }}","build":"${{ steps.build.outcome }}","test":"${{ steps.test.outcome }}","verify":"${{ steps.verify.outcome }}","publish":"${{ steps.publish.outcome }}"}
        run: python3 -B "$ROOT/ci.py" persist
  verify-pull:
    needs: build
    if: needs.build.result == 'success' && needs.build.outputs.digest != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
      packages: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      RESULT_RUNNER_LABEL: ubuntu-24.04
      RESULT_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
      RESULT_PHASE: pull
      RESULT_PUBLISHED_TAG: ${{ needs.build.outputs.tag }}
      RESULT_PUBLISHED_DIGEST: ${{ needs.build.outputs.digest }}
      ROOT: world-simulation-shorts-engine/recovery/studio-dropbox-gpu-production-v1
    steps:
      - name: Independent fresh checkout
        id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/studio-dropbox-gpu-production-v1.yml
            /world-simulation-shorts-engine/recovery/studio-dropbox-gpu-production-v1/**
            /world-simulation-shorts-engine/recovery/studio-dropbox-offline-v1/**
            /world-simulation-shorts-engine/recovery/studio-https-bootstrap-v1/ci_package.py
      - name: Require free runner and protected sources
        id: preflight
        run: python3 -B "$ROOT/ci.py" preflight
      - name: Verify digest tag source and original layers
        id: pull
        run: python3 -B "$ROOT/ci.py" pull
      - name: Read existing Dropbox checkpoint and recreate CPU container without new upload
        id: restart
        env:
          WORLD_ENGINE_STUDIO_BACKUP_KEY: ${{ secrets.WORLD_ENGINE_STUDIO_BACKUP_KEY }}
          WORLD_ENGINE_STUDIO_BACKUP_DROPBOX_APP_KEY: ${{ secrets.WORLD_ENGINE_STUDIO_BACKUP_DROPBOX_APP_KEY }}
          WORLD_ENGINE_STUDIO_BACKUP_DROPBOX_APP_SECRET: ${{ secrets.WORLD_ENGINE_STUDIO_BACKUP_DROPBOX_APP_SECRET }}
          WORLD_ENGINE_STUDIO_BACKUP_DROPBOX_REFRESH_TOKEN: ${{ secrets.WORLD_ENGINE_STUDIO_BACKUP_DROPBOX_REFRESH_TOKEN }}
        run: python3 -B "$ROOT/ci.py" restart
      - name: Persist safe restart and independent pull proof
        if: always() && steps.checkout.outcome == 'success'
        env:
          RESULT_STEP_OUTCOMES: >-
            {"preflight":"${{ steps.preflight.outcome }}","pull":"${{ steps.pull.outcome }}","restart":"${{ steps.restart.outcome }}"}
        run: python3 -B "$ROOT/ci.py" persist
