name: WORLD ENGINE immutable image camera hold follow-up

on:
  push:
    branches: [development/reference-visual-master-v2-20261016]
    paths:
      - .github/workflows/reference-visual-master-v2-camera-proof.yml
      - world-simulation-shorts-engine/recovery/reference-visual-master-v2/validation/**
  workflow_dispatch:

concurrency:
  group: world-engine-reference-v2-camera-proof-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  camera-proof:
    if: github.repository == 'dimon3898-sys/yeonhwarok-free' && github.event.repository.private == false && github.ref == 'refs/heads/development/reference-visual-master-v2-20261016'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RESULT_RUNNER_LABEL: ubuntu-24.04
      RESULT_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
      RESULT_PHASE: camera-followup
      RESULT_CI_STATE: ${{ runner.temp }}/reference-camera-${{ github.run_id }}-${{ github.run_attempt }}.json
      PYTHONDONTWRITEBYTECODE: '1'
      # Public image pull requires no registry login or package write permission.
      DOCKER_CONFIG: ${{ runner.temp }}/reference-camera-empty-docker-config
    steps:
      - name: Fetch new validation tools and frozen image source contracts
        id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/reference-visual-master-v2-camera-proof.yml
            /world-simulation-shorts-engine/recovery/reference-visual-master-v2/**
            !/world-simulation-shorts-engine/recovery/reference-visual-master-v2/analysis/**
            !/world-simulation-shorts-engine/recovery/reference-visual-master-v2/runs/**
            /world-simulation-shorts-engine/recovery/reference-visual-master-v2/runs/38831714161-1/build.json
            /world-simulation-shorts-engine/recovery/visual-quality-upgrade-v1/**
            !/world-simulation-shorts-engine/recovery/visual-quality-upgrade-v1/runs/**
            /world-simulation-shorts-engine/recovery/astra-gpu-activation-v1/**
            !/world-simulation-shorts-engine/recovery/astra-gpu-activation-v1/runs/**
            /world-simulation-shorts-engine/recovery/astra-gpu-integration-v1/upload_bundle.py
            /world-simulation-shorts-engine/recovery/astra-gpu-integration-v1/gpu_upload.mjs
            /world-simulation-shorts-engine/recovery/gcube-diagnostic-result-v1/ci.py
            /world-simulation-shorts-engine/recovery/rtx-image-build-v1/**
      - name: Require free standard runner, 20 GiB disk and unchanged immutable sources
        id: preflight
        run: python3 -B world-simulation-shorts-engine/recovery/reference-visual-master-v2/validation/camera_ci.py preflight
      - name: Test camera proof rejection rules and bounded evidence collector
        id: tests
        run: python3 -B -m unittest discover -s world-simulation-shorts-engine/recovery/reference-visual-master-v2/validation -p test_camera_ci.py -v
      - name: Pull fixed published digest and verify original strict source union
        id: verify
        run: python3 -B world-simulation-shorts-engine/recovery/reference-visual-master-v2/validation/camera_ci.py verify
      - name: Draw A100 and E99-101 using explicit CPU SwiftShader only
        id: probe
        run: python3 -B world-simulation-shorts-engine/recovery/reference-visual-master-v2/validation/camera_ci.py probe
      - name: Persist bounded camera JSON and two source-free PNG checkpoints
        if: always() && steps.checkout.outcome == 'success'
        env:
          RESULT_STEP_OUTCOMES: >-
            {"preflight":"${{ steps.preflight.outcome }}","tests":"${{ steps.tests.outcome }}","verify":"${{ steps.verify.outcome }}","probe":"${{ steps.probe.outcome }}"}
        run: python3 -B world-simulation-shorts-engine/recovery/reference-visual-master-v2/validation/camera_ci.py persist
