name: Build and publish Gcube image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/gcube-image.yml
      - world-simulation-shorts-engine/requirements.txt
      - world-simulation-shorts-engine/server.py
      - world-simulation-shorts-engine/engine/**
      - world-simulation-shorts-engine/data/**
      - world-simulation-shorts-engine/web/**
      - world-simulation-shorts-engine/assets/**
      - world-simulation-shorts-engine/tools/**
      - world-simulation-shorts-engine/deployment/**
      - cinematic-world-map/package.json
      - cinematic-world-map/package-lock.json
      - cinematic-world-map/src/**
      - cinematic-world-map/assets/**
      - cinematic-world-map/tools/sound.py
      - deliverables/WORLD_SIMULATION_ENGINE/PRODUCTION_RHYTHM_MASTER_v001/PRODUCTION_RHYTHM_QC_CERTIFICATE.json
      - deliverables/WORLD_SIMULATION_ENGINE/PRODUCTION_RHYTHM_MASTER_v001/production_rhythm_master_10_15s.mp4

permissions:
  contents: read
  packages: write

concurrency:
  group: gcube-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'dimon3898-sys/yeonhwarok-free'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      IMAGE: ghcr.io/dimon3898-sys/world-simulation-shorts-engine
    steps:
      - name: Checkout approved sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build the complete image for local smoke testing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: world-simulation-shorts-engine/deployment/gcube/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: |
            ${{ env.IMAGE }}:gcube-v001
            ${{ env.IMAGE }}:gcube-v001-sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Verify CPU startup and private health before publication
        shell: bash
        run: |
          set -euo pipefail
          smoke_name="world-engine-gcube-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          smoke_env="${RUNNER_TEMP}/gcube-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.env"
          smoke_diagnostics="${RUNNER_TEMP}/gcube-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.diagnostics"
          cleanup() {
            smoke_status=$?
            if [ "$smoke_status" -ne 0 ]; then
              docker logs --tail 100 "$smoke_name" 2>/dev/null | python -c 'import re, sys; allowed = re.compile(r"(?:GCUBE startup blocked: [A-Za-z][A-Za-z0-9_]{0,79}|World Engine ready on8000; owner-code is private; no provider stop or GPU speedup is implied\.)"); [print(line.rstrip()) for line in sys.stdin if allowed.fullmatch(line.rstrip())]' > "$smoke_diagnostics" || true
            fi
            docker rm --force "$smoke_name" >/dev/null 2>&1 || true
            rm -f "$smoke_env"
          }
          trap cleanup EXIT
          umask 077
          python - "$smoke_env" <<'PY'
          import os, secrets, sys
          owner = secrets.token_urlsafe(32)
          print('::add-mask::' + owner)
          with open(sys.argv[1], 'x', encoding='utf-8') as stream:
              stream.write('WORLD_ENGINE_OWNER_CODE=' + owner + '\n')
              stream.write('WORLD_ENGINE_RENDER_MODE=cpu\n')
              stream.write('WORLD_ENGINE_STORAGE_MODE=ephemeral\n')
              stream.write('WORLD_ENGINE_STORAGE_PATH=/data\n')
              stream.write('WORLD_ENGINE_LOCAL_MODE=1\n')
              stream.write('WORLD_ENGINE_PUBLIC_ORIGIN=http://127.0.0.1:18000\n')
          os.chmod(sys.argv[1], 0o600)
          PY
          docker run --detach --name "$smoke_name" \
            --publish 127.0.0.1:18000:8000 --env-file "$smoke_env" \
            "${IMAGE}:gcube-v001" >/dev/null
          python - "$smoke_env" <<'PY'
          import http.client, http.cookiejar, json, pathlib, re, sys, time
          from urllib.error import HTTPError, URLError
          from urllib.request import HTTPCookieProcessor, ProxyHandler, Request, build_opener
          endpoint = 'http://127.0.0.1:18000'
          local = build_opener(ProxyHandler({}), HTTPCookieProcessor(http.cookiejar.CookieJar()))
          deadline = time.monotonic() + 90
          while time.monotonic() < deadline:
              try:
                  with local.open(endpoint + '/api/health', timeout=2) as response:
                      health = json.load(response)
                  if health.get('ok') is True and health.get('authentication_required') is True:
                      break
              except (OSError, http.client.HTTPException, ValueError):
                  pass
              time.sleep(1)
          else:
              raise SystemExit('CPU gateway did not become ready within 90 seconds')
          gpu = health.get('gpu', {})
          storage = health.get('storage', {})
          if gpu.get('render_mode') != 'cpu' or gpu.get('gpu_rendering_verified') is not False:
              raise SystemExit('Smoke test did not verify the explicit CPU profile')
          if storage.get('mode') != 'ephemeral':
              raise SystemExit('Smoke test did not use ephemeral storage')
          try:
              with local.open(endpoint + '/api/projects', timeout=2):
                  raise SystemExit('Unauthenticated project access unexpectedly succeeded')
          except HTTPError as error:
              if error.code != 401:
                  raise SystemExit('Unauthenticated project access did not require login')
          owner = next(line.partition('=')[2] for line in pathlib.Path(sys.argv[1]).read_text().splitlines()
                       if line.startswith('WORLD_ENGINE_OWNER_CODE='))
          request = Request(endpoint + '/auth/login', data=json.dumps({'password': owner}).encode(),
                            headers={'Origin': endpoint, 'Content-Type': 'application/json'}, method='POST')
          with local.open(request, timeout=5) as response:
              if json.load(response).get('authenticated') is not True:
                  raise SystemExit('Owner login did not succeed')
          with local.open(endpoint + '/api/projects', timeout=5) as response:
              projects = json.load(response).get('projects', [])
          if len(projects) != 1:
              raise SystemExit('The unapproved short validation project was not prepared')
          project = projects[0]
          if project.get('status') != 'planned' or not re.fullmatch(r'project_[a-f0-9]{12}', project.get('id', '')):
              raise SystemExit('The short validation project was not left unapproved')
          with local.open(endpoint + '/api/projects/' + project['id'], timeout=5) as response:
              detail = json.load(response)
          plan = detail.get('plan', {})
          if (detail.get('version') != 'v001' or plan.get('duration') != 12 or
                  len(plan.get('scenes', [])) != 5 or plan.get('gate', {}).get('passed') is not True):
              raise SystemExit('The prepared validation plan was not the certified short fixture')
          with local.open(endpoint + '/', timeout=5) as response:
              if b'/gcube/benchmark.json' not in response.read(1024 * 1024):
                  raise SystemExit('Mobile UI did not expose owner measurement download')
          with local.open(endpoint + '/gcube/benchmark.json', timeout=5) as response:
              diagnostics = json.load(response)
              if diagnostics.get('runtime', {}).get('render_mode') != 'cpu':
                  raise SystemExit('Measurement download did not record the CPU profile')
              if not response.headers.get('Content-Disposition', '').startswith('attachment;'):
                  raise SystemExit('Owner measurement response was not a download')
          print('CPU startup, owner login, mobile UI, unapproved short plan and measurement download passed; no render was requested')
          PY
      - name: Report bounded startup diagnostics after a failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          docker image inspect "${IMAGE}:gcube-v001" --format '{"Id":{{json .Id}},"Size":{{json .Size}},"Architecture":{{json .Architecture}},"WorkingDir":{{json .Config.WorkingDir}},"Entrypoint":{{json .Config.Entrypoint}},"Cmd":{{json .Config.Cmd}}}' | python -c 'import sys; value = sys.stdin.read(8192).strip(); print("::notice title=Gcube image configuration::" + value.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")) if value else None' || true
          smoke_diagnostics="${RUNNER_TEMP}/gcube-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.diagnostics"
          if [ -f "$smoke_diagnostics" ]; then
            head -n 100 "$smoke_diagnostics" | python -c 'import sys; [print("::notice title=Gcube startup::" + line.rstrip()) for line in sys.stdin]'
            rm -f "$smoke_diagnostics"
          fi
      - name: Authenticate to GHCR after successful CPU smoke test
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested development image
        shell: bash
        run: |
          set -euo pipefail
          docker push "${IMAGE}:gcube-v001"
          docker push "${IMAGE}:gcube-v001-sha-${GITHUB_SHA}"
          echo 'Publication preserves existing package visibility; anonymous pulls require a public package.'
