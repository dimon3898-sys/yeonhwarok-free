      - name: Common direction fixtures on the actual v013 runtime defaults
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --env WORLD_ENGINE_MAP_INFOGRAPHIC_VERSION=legacy --env WORLD_ENGINE_STORY_PROGRESSION_VERSION=legacy --env WORLD_ENGINE_REFERENCE_EFFECTS_VERSION=legacy --env WORLD_ENGINE_EVENT_QUALITY_VERSION=legacy --env WORLD_ENGINE_VISUAL_QUALITY_VERSION=legacy --env WORLD_ENGINE_SECOND_EVENT_TEST=0 --env WORLD_ENGINE_SINGLE_EVENT_CAMERA_TEST=0 --env WORLD_ENGINE_RETURN_WIDE_TEST=0 --user 1000:1000 --entrypoint python ${IMAGE}:${RELEASE_TAG} -m deployment.gcube.reference_preflight
      - name: Reference-master real synthetic media, new files and checkpoint retry
