name: Validate and publish map infographic v022
on:
  push:
    branches: [fix/v022-map-infographic]
    paths:
      - world-simulation-shorts-engine/engine/**
      - world-simulation-shorts-engine/data/**
      - world-simulation-shorts-engine/web/**
      - world-simulation-shorts-engine/tools/**
      - world-simulation-shorts-engine/tests/**
      - world-simulation-shorts-engine/deployment/**
      - world-simulation-shorts-engine/server.py
      - world-simulation-shorts-engine/requirements.txt
      - deployment/gcube-proxy-diag/**
      - .github/workflows/gcube-infographic-v022.yml
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: gcube-v022-map-infographic-publication
  cancel-in-progress: true
jobs:
  publish:
    if: github.repository == 'dimon3898-sys/yeonhwarok-free'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      IMAGE: ghcr.io/dimon3898-sys/world-simulation-shorts-engine
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Select a source-specific immutable v022 tag
        shell: bash
        run: |
          set -euo pipefail
          test "${#GITHUB_SHA}" = 40
          printf 'RELEASE_TAG=gcube-v022-map-infographic-%s\n' "${GITHUB_SHA:0:12}" >> "$GITHUB_ENV"
      - name: Verify frozen source and asset manifest before build
        shell: bash
        run: |
          set -euo pipefail
          python world-simulation-shorts-engine/deployment/gcube/infographic_preflight.py --manifest-only --checkout
      - name: Refuse an existing release tag before building
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYGUARD'
          import json,os,urllib.request,urllib.error
          image='dimon3898-sys/world-simulation-shorts-engine'
          grant=json.load(urllib.request.urlopen('https://ghcr.io/token?service=ghcr.io&scope=repository:'+image+':pull',timeout=30))
          request=urllib.request.Request('https://ghcr.io/v2/'+image+'/manifests/'+os.environ['RELEASE_TAG'],method='HEAD',headers={'Authorization':'Bearer '+grant['token'],'Accept':'application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.v2+json'})
          try:
              urllib.request.urlopen(request,timeout=30)
          except urllib.error.HTTPError as error:
              if error.code!=404:raise RuntimeError('RELEASE_ABSENCE_NOT_VERIFIED') from None
              print('Immutable release tag absent; new publication permitted.')
          else:raise RuntimeError('RELEASE_ALREADY_EXISTS_REFUSING_OVERWRITE')
          PYGUARD
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build complete infographic image without publishing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: world-simulation-shorts-engine/deployment/gcube/Dockerfile.infographic-v022
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE }}:${{ env.RELEASE_TAG }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Whole v021 baseline and OFF/ON infographic container contract
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --env WORLD_ENGINE_MAP_INFOGRAPHIC_VERSION=v022 --env WORLD_ENGINE_STORY_PROGRESSION_VERSION=v021 -i --user 0:0 --entrypoint python ${IMAGE}:${RELEASE_TAG} - <<'PYQUALITY'
          import os
          from pathlib import Path
          for name in ('cache','audio'):
              p=Path('/run/world-engine')/name;p.mkdir(parents=True,exist_ok=True);os.chown(p,1000,1000)
          os.setgroups([]);os.setgid(1000);os.setuid(1000)
          from deployment.gcube.infographic_preflight import run
          report=run('/data/infographic-preflight', require_container_assets=True)
          assert report['passed'],report
          PYQUALITY
      - name: Isolated 31-case v020 regressions with bounded failure metadata
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --env WORLD_ENGINE_MAP_INFOGRAPHIC_VERSION=legacy --env WORLD_ENGINE_STORY_PROGRESSION_VERSION=legacy --env WORLD_ENGINE_REFERENCE_EFFECTS_VERSION=legacy --env WORLD_ENGINE_EVENT_QUALITY_VERSION=legacy --env WORLD_ENGINE_VISUAL_QUALITY_VERSION=legacy --env WORLD_ENGINE_SECOND_EVENT_TEST=0 --env WORLD_ENGINE_SINGLE_EVENT_CAMERA_TEST=0 --env WORLD_ENGINE_RETURN_WIDE_TEST=0 --user 0:0 --env WORLD_ENGINE_DIRECTION_VERSION=legacy -i \
            --mount "type=bind,source=${PWD}/world-simulation-shorts-engine/tests,target=/opt/world-engine/world-simulation-shorts-engine/tests,readonly" \
            --entrypoint python ${IMAGE}:${RELEASE_TAG} - <<'PYV020'
          import hashlib, io, json, pathlib, re, traceback, unittest
          NATIVE_TEST = 'test_reference_effects_v020.ReferenceEffects.test_actual_node_overlay_preserves_all_720_camera_material_and_off_frames'
          NODE_FILES = {'test_reference_effects_v020.mjs', 'reference_effects_adapter.js', 'event_quality_adapter.js', 'visual_quality_adapter.js', 'scene_diagnostic_journal.mjs'}
          NODE_TYPES = {'AssertionError', 'SyntaxError', 'TypeError', 'RangeError', 'ReferenceError', 'Error', 'URIError', 'EvalError'}

          def identifiers(suite):
              values = []
              for test in suite:
                  values.extend(identifiers(test) if isinstance(test, unittest.TestSuite) else [test.id()])
              return sorted(values)

          class SafeResult(unittest.TextTestResult):
              def __init__(self, *args, **kwargs):
                  super().__init__(*args, **kwargs)
                  self.executed = []
                  self.safe_failures = []

              def startTest(self, test):
                  self.executed.append(test.id())
                  super().startTest(test)

              def record_failure(self, test, error):
                  if len(self.safe_failures) >= 25:
                      return
                  identity = test.id().split(' (', 1)[0]
                  locations = [{'file': pathlib.Path(frame.filename).name, 'line': frame.lineno}
                               for frame in traceback.extract_tb(error[2])
                               if pathlib.Path(frame.filename).name.startswith('test_')
                               and pathlib.Path(frame.filename).suffix == '.py'][-6:]
                  record = dict(test_id=identity, exception_type=error[0].__name__, python_test_locations=locations)
                  if identity == NATIVE_TEST:
                      message = str(error[1])
                      bounded = message[:8192] + '\n' + message[-65536:]
                      node_locations = []
                      for filename in sorted(NODE_FILES):
                          for match in re.finditer(re.escape(filename) + r':(\d+)(?::\d+)?', bounded):
                              location = dict(file=filename, line=int(match.group(1)))
                              if location not in node_locations:
                                  node_locations.append(location)
                      node_types = sorted(set(re.findall(r'\b(AssertionError|SyntaxError|TypeError|RangeError|ReferenceError|Error|URIError|EvalError)(?: \[[A-Z][A-Z0-9_]+\])?:', bounded)) & NODE_TYPES)
                      codes = sorted(set(re.findall(r'\b(?:ERR_ASSERTION|REFERENCE_EFFECTS_[A-Z0-9_]+|EVENT_QUALITY_[A-Z0-9_]+|VISUAL_QUALITY_[A-Z0-9_]+|SHADER_CONTRACT_[A-Z0-9_]+)\b', bounded)))[:12]
                      exit_match = re.search(r'(?:^|AssertionError:\s*)(-?\d+)\s*!=\s*0(?:\s|:|$)', message[:8192])
                      record.update(node_locations=node_locations[:12], node_error_types=node_types,
                                    node_error_codes=codes,
                                    node_exit_code=int(exit_match.group(1)) if exit_match else None)
                  self.safe_failures.append(record)

              def addFailure(self, test, error):
                  self.record_failure(test, error)
                  super().addFailure(test, error)

              def addError(self, test, error):
                  self.record_failure(test, error)
                  super().addError(test, error)

              def addSubTest(self, test, subtest, error):
                  if error is not None:
                      self.record_failure(test, error)
                  super().addSubTest(test, subtest, error)

          for name in ('cache', 'audio'):
              (pathlib.Path('/run/world-engine') / name).mkdir(parents=True, exist_ok=True)
          loader = unittest.TestLoader()
          suite = loader.discover('tests', pattern='test_reference_effects_v020.py')
          expected = identifiers(suite)
          assert not loader.errors, 'V020_IMPORT_FAILURE'
          assert len(expected) == len(set(expected)) == 31, 'V020_TEST_INVENTORY_CHANGED'
          assert all(identity.startswith('test_reference_effects_v020.') for identity in expected)
          result = unittest.TextTestRunner(stream=io.StringIO(), verbosity=1, resultclass=SafeResult).run(suite)
          print('::notice title=Isolated v020 regressions::' + json.dumps(dict(tests=result.testsRun, failures=len(result.failures), errors=len(result.errors), skipped=len(result.skipped))))
          print('::notice title=Safe v020 failure metadata::' + json.dumps(result.safe_failures))
          assert sorted(result.executed) == expected and result.testsRun == 31, 'V020_TEST_EXECUTION_INCOMPLETE'
          raise SystemExit(not result.wasSuccessful() or bool(result.skipped))
          PYV020
      - name: Isolated 35-case v021 regressions with bounded failure metadata
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --env WORLD_ENGINE_MAP_INFOGRAPHIC_VERSION=legacy --env WORLD_ENGINE_STORY_PROGRESSION_VERSION=legacy --env WORLD_ENGINE_REFERENCE_EFFECTS_VERSION=legacy --env WORLD_ENGINE_EVENT_QUALITY_VERSION=legacy --env WORLD_ENGINE_VISUAL_QUALITY_VERSION=legacy --env WORLD_ENGINE_SECOND_EVENT_TEST=0 --env WORLD_ENGINE_SINGLE_EVENT_CAMERA_TEST=0 --env WORLD_ENGINE_RETURN_WIDE_TEST=0 --user 0:0 --env WORLD_ENGINE_DIRECTION_VERSION=legacy -i \
            --mount "type=bind,source=${PWD}/world-simulation-shorts-engine/tests,target=/opt/world-engine/world-simulation-shorts-engine/tests,readonly" \
            --entrypoint python ${IMAGE}:${RELEASE_TAG} - <<'PYV021'
          import hashlib, io, json, pathlib, re, traceback, unittest
          V021_TEST_COUNT = 35
          NATIVE_TEST = 'test_story_progression_v021.StoryProgression.test_native_all_720_frames_freeze_camera_material_and_off_canvas'
          NODE_FILES = {'test_story_progression_v021.mjs', 'story_progression_adapter.js', 'test_story_progression_v021.mjs', 'reference_effects_adapter.js', 'event_quality_adapter.js', 'visual_quality_adapter.js', 'scene_diagnostic_journal.mjs'}
          NODE_TYPES = {'AssertionError', 'SyntaxError', 'TypeError', 'RangeError', 'ReferenceError', 'Error', 'URIError', 'EvalError'}

          def identifiers(suite):
              values = []
              for test in suite:
                  values.extend(identifiers(test) if isinstance(test, unittest.TestSuite) else [test.id()])
              return sorted(values)

          class SafeResult(unittest.TextTestResult):
              def __init__(self, *args, **kwargs):
                  super().__init__(*args, **kwargs)
                  self.executed = []
                  self.safe_failures = []

              def startTest(self, test):
                  self.executed.append(test.id())
                  super().startTest(test)

              def record_failure(self, test, error):
                  if len(self.safe_failures) >= 25:
                      return
                  identity = test.id().split(' (', 1)[0]
                  locations = [{'file': pathlib.Path(frame.filename).name, 'line': frame.lineno}
                               for frame in traceback.extract_tb(error[2])
                               if pathlib.Path(frame.filename).name.startswith('test_')
                               and pathlib.Path(frame.filename).suffix == '.py'][-6:]
                  record = dict(test_id=identity, exception_type=error[0].__name__, python_test_locations=locations)
                  if identity.startswith('test_story_progression_v021.'):
                      message = str(error[1])
                      bounded = message[:8192] + '\n' + message[-65536:]
                      node_locations = []
                      for filename in sorted(NODE_FILES):
                          for match in re.finditer(re.escape(filename) + r':(\d+)(?::\d+)?', bounded):
                              location = dict(file=filename, line=int(match.group(1)))
                              if location not in node_locations:
                                  node_locations.append(location)
                      node_types = sorted(set(re.findall(r'\b(AssertionError|SyntaxError|TypeError|RangeError|ReferenceError|Error|URIError|EvalError)(?: \[[A-Z][A-Z0-9_]+\])?:', bounded)) & NODE_TYPES)
                      codes = sorted(set(re.findall(r'\b(?:ERR_ASSERTION|STORY_PROGRESSION_[A-Z0-9_]+|REFERENCE_EFFECTS_[A-Z0-9_]+|EVENT_QUALITY_[A-Z0-9_]+|VISUAL_QUALITY_[A-Z0-9_]+|SHADER_CONTRACT_[A-Z0-9_]+)\b', bounded)))[:12]
                      exit_match = re.search(r'(?:^|AssertionError:\s*)(-?\d+)\s*!=\s*0(?:\s|:|$)', message[:8192])
                      record.update(node_locations=node_locations[:12], node_error_types=node_types,
                                    node_error_codes=codes,
                                    node_exit_code=int(exit_match.group(1)) if exit_match else None)
                  self.safe_failures.append(record)

              def addFailure(self, test, error):
                  self.record_failure(test, error)
                  super().addFailure(test, error)

              def addError(self, test, error):
                  self.record_failure(test, error)
                  super().addError(test, error)

              def addSubTest(self, test, subtest, error):
                  if error is not None:
                      self.record_failure(test, error)
                  super().addSubTest(test, subtest, error)

          for name in ('cache', 'audio'):
              (pathlib.Path('/run/world-engine') / name).mkdir(parents=True, exist_ok=True)
          loader = unittest.TestLoader()
          suite = loader.discover('tests', pattern='test_story_progression_v021.py')
          expected = identifiers(suite)
          assert not loader.errors, 'V021_IMPORT_FAILURE'
          assert len(expected) == len(set(expected)) == V021_TEST_COUNT, 'V021_TEST_INVENTORY_CHANGED'
          assert all(identity.startswith('test_story_progression_v021.') for identity in expected)
          assert hashlib.sha256(('\n'.join(expected) + '\n').encode()).hexdigest() == '92d35ed1fad74495bac2f2686836e85ab718df81f2ad242faee70352f4cd6f46', 'V021_REGRESSION_IDS_CHANGED'
          result = unittest.TextTestRunner(stream=io.StringIO(), verbosity=1, resultclass=SafeResult).run(suite)
          print('::notice title=Isolated v021 regressions::' + json.dumps(dict(tests=result.testsRun, failures=len(result.failures), errors=len(result.errors), skipped=len(result.skipped))))
          print('::notice title=Safe v021 failure metadata::' + json.dumps(result.safe_failures))
          assert sorted(result.executed) == expected and result.testsRun == V021_TEST_COUNT, 'V021_TEST_EXECUTION_INCOMPLETE'
          raise SystemExit(not result.wasSuccessful() or bool(result.skipped))
          PYV021
      - name: Isolated frozen v022 regressions and strict execution inventory
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --env WORLD_ENGINE_MAP_INFOGRAPHIC_VERSION=legacy --env WORLD_ENGINE_STORY_PROGRESSION_VERSION=legacy --env WORLD_ENGINE_REFERENCE_EFFECTS_VERSION=legacy --env WORLD_ENGINE_EVENT_QUALITY_VERSION=legacy --env WORLD_ENGINE_VISUAL_QUALITY_VERSION=legacy --env WORLD_ENGINE_SECOND_EVENT_TEST=0 --env WORLD_ENGINE_SINGLE_EVENT_CAMERA_TEST=0 --env WORLD_ENGINE_RETURN_WIDE_TEST=0 --env WORLD_ENGINE_DIRECTION_VERSION=legacy --user 0:0 -i \
            --mount "type=bind,source=${PWD}/world-simulation-shorts-engine/tests,target=/opt/world-engine/world-simulation-shorts-engine/tests,readonly" \
            --entrypoint python ${IMAGE}:${RELEASE_TAG} - <<'PYV022'
          from pathlib import Path
          for name in ('cache', 'audio'):
              (Path('/run/world-engine')/name).mkdir(parents=True, exist_ok=True)
          from deployment.gcube.infographic_preflight import run_isolated_tests
          run_isolated_tests()
          PYV022
      - name: Required packages, readonly assets, UID1000 write paths and real synthetic media pipeline
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --env WORLD_ENGINE_MAP_INFOGRAPHIC_VERSION=legacy --env WORLD_ENGINE_STORY_PROGRESSION_VERSION=legacy --env WORLD_ENGINE_REFERENCE_EFFECTS_VERSION=legacy --env WORLD_ENGINE_EVENT_QUALITY_VERSION=legacy --env WORLD_ENGINE_VISUAL_QUALITY_VERSION=legacy --env WORLD_ENGINE_SECOND_EVENT_TEST=0 --env WORLD_ENGINE_SINGLE_EVENT_CAMERA_TEST=0 --env WORLD_ENGINE_RETURN_WIDE_TEST=0 -i --env WORLD_ENGINE_DIRECTION_VERSION=v012 --entrypoint python ${IMAGE}:${RELEASE_TAG} - <<'PY'
          import os,json,subprocess
          from pathlib import Path
          for name in ('libegl1','libvulkan1','libx11-6','libxext6'):
              assert subprocess.check_output(['dpkg-query','-W','-f=${Status}',name],text=True)=='install ok installed'
          for command in (['node','--version'],['chromium','--version'],['ffmpeg','-version']):subprocess.run(command,check=True,capture_output=True)
          for name in ('cache','audio'):
              p=Path('/run/world-engine')/name;p.mkdir(parents=True,exist_ok=True);os.chown(p,1000,1000)
          os.setgroups([]);os.setgid(1000);os.setuid(1000)
          from deployment.gcube.asset_audit import audit_assets
          from deployment.gcube.pipeline_media_preflight import run
          audit=audit_assets();assert audit['passed']
          for name in ('tmp','cache','frames','outputs','checkpoints'):
              p=Path('/data')/name;p.mkdir(parents=True,exist_ok=True);q=p/'write-test';q.write_text('ok');q.unlink()
          try:
              report=run('/data/synthetic-pipeline')
          except Exception as error:
              detail=dict(type=type(error).__name__,message=str(error)[:1500],stderr=str(getattr(error,'stderr',''))[-1500:])
              print('::error title=Container pipeline exception::'+json.dumps(detail))
              raise
          if not report['passed']:
              print('::error title=Container QC failures::'+json.dumps(dict(failures=report['qc_failures'])))
          from deployment.gcube.pipeline_retry_preflight import run as retry
          assert retry('/data/synthetic-pipeline')['passed']
          summary={key:value for key,value in report.items() if key not in ('assets','qc_warnings')}
          summary['asset_count']=len(audit['assets'])
          print('::notice title=Container pipeline result::'+json.dumps(summary,ensure_ascii=False))
          assert report['passed'],report['qc_failures']
          PY
      - name: Exact production collect-all preflight before and after timing fix
        shell: bash
        run: |
          docker run --rm --env WORLD_ENGINE_MAP_INFOGRAPHIC_VERSION=legacy --env WORLD_ENGINE_STORY_PROGRESSION_VERSION=legacy --env WORLD_ENGINE_REFERENCE_EFFECTS_VERSION=legacy --env WORLD_ENGINE_EVENT_QUALITY_VERSION=legacy --env WORLD_ENGINE_VISUAL_QUALITY_VERSION=legacy --env WORLD_ENGINE_SECOND_EVENT_TEST=0 --env WORLD_ENGINE_SINGLE_EVENT_CAMERA_TEST=0 --env WORLD_ENGINE_RETURN_WIDE_TEST=0 -i --user 0:0 --entrypoint python ${IMAGE}:${RELEASE_TAG} - <<'PY'
