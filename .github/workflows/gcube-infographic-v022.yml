          assert len(original) == 701 and len(v020) == 31 and len(baseline) == 732 and len(added) == V021_TEST_COUNT, 'REGRESSION_TEST_INVENTORY_CHANGED'
          assert hashlib.sha256(('\n'.join(original) + '\n').encode()).hexdigest() == '57aa3d46894ac5f50309dead36896f53fc5d76781b2f362ee457c3b07136ba8f', 'INHERITED_REGRESSION_IDS_CHANGED'
          assert hashlib.sha256(('\n'.join(baseline) + '\n').encode()).hexdigest() == 'b4f2e47600984e208f0652827308385137b4c4fd863321b606242cfa0b81b9ad', 'V020_INHERITED_REGRESSION_IDS_CHANGED'
          assert hashlib.sha256(('\n'.join(added) + '\n').encode()).hexdigest() == '92d35ed1fad74495bac2f2686836e85ab718df81f2ad242faee70352f4cd6f46', 'V021_REGRESSION_IDS_CHANGED'
          result = unittest.TextTestRunner(stream=io.StringIO(), verbosity=1, resultclass=SafeResult).run(suite)
          print('::notice title=Core regressions::' + json.dumps(dict(tests=result.testsRun, inherited=767, v020=len(v020), v021=len(added), v022=len(v022), unique_release_tests=len(expected)+206+31, failures=len(result.failures), errors=len(result.errors), skipped=len(result.skipped), failed_tests=[test.id().split(' (', 1)[0] for test, _ in result.failures + result.errors])))
          print('::notice title=Safe v020/v021/v022 failure metadata::' + json.dumps(result.safe_failures))
          assert sorted(result.executed) == expected and result.testsRun == len(expected), 'REGRESSION_EXECUTION_INCOMPLETE'
          raise SystemExit(not result.wasSuccessful() or bool(result.skipped))
          PYCORE
