name: WORLD ENGINE opt-in universal production V3 image

on:
  push:
    branches: [development/universal-production-v3-20261016]
    paths:
      - .github/workflows/universal-production-v3.yml
      - world-simulation-shorts-engine/recovery/universal-production-v3/*.py
      - world-simulation-shorts-engine/recovery/universal-production-v3/*.mjs
      - world-simulation-shorts-engine/recovery/universal-production-v3/Dockerfile
      - world-simulation-shorts-engine/recovery/universal-production-v3/BASELINE_LOCK.json
      - world-simulation-shorts-engine/recovery/universal-production-v3/PARENT_CLOSURE.json
      - world-simulation-shorts-engine/recovery/universal-production-v3/history/**
      - world-simulation-shorts-engine/recovery/universal-production-v3/fixtures/**
      - world-simulation-shorts-engine/recovery/universal-production-v3/tests/**
  workflow_dispatch:

concurrency:
  group: world-engine-production-v3-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'dimon3898-sys/yeonhwarok-free' && github.event.repository.private == false && github.ref == 'refs/heads/development/universal-production-v3-20261016'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    outputs:
      tag: ${{ steps.publish.outputs.tag }}
      digest: ${{ steps.publish.outputs.digest }}
    env:
      RESULT_RUNNER_LABEL: ubuntu-24.04
      RESULT_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
      RESULT_PHASE: build
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Fetch new production lane and immutable V2 contracts
        id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/universal-production-v3.yml
            /world-simulation-shorts-engine/recovery/universal-production-v3/**
            /world-simulation-shorts-engine/recovery/universal-auto-video-v2/**
            /world-simulation-shorts-engine/recovery/reference-visual-master-v2/**
            /world-simulation-shorts-engine/recovery/planner-scene-json-v1/**
            /world-simulation-shorts-engine/web/map_infographic_v1/**
            /cinematic-world-map/assets/**
            /world-simulation-shorts-engine/recovery/visual-quality-upgrade-v1/**
            /world-simulation-shorts-engine/recovery/astra-gpu-activation-v1/**
            /world-simulation-shorts-engine/recovery/astra-gpu-integration-v1/upload_bundle.py
            /world-simulation-shorts-engine/recovery/astra-gpu-integration-v1/gpu_upload.mjs
            /world-simulation-shorts-engine/recovery/gcube-detached-render-v1/JOB_FILES.json
            /world-simulation-shorts-engine/recovery/gcube-detached-render-v1/job_manager.py
            /world-simulation-shorts-engine/recovery/gcube-detached-render-v1/job_store.py
            /world-simulation-shorts-engine/recovery/gcube-detached-render-v1/inspect_existing.py
            /world-simulation-shorts-engine/recovery/rtx-image-build-v1/**
            /world-simulation-shorts-engine/recovery/rtx-gpu-package-v1/source_contract.json
            /world-simulation-shorts-engine/recovery/gcube-65422-render-v1/ci.py
            /world-simulation-shorts-engine/recovery/gcube-65422-render-v1/verify_artifacts.py
            /world-simulation-shorts-engine/recovery/gcube-65422-render-v1/tests/test_artifacts.py
            /world-simulation-shorts-engine/recovery/gcube-65422-render-v1/image-manifests/**
            /world-simulation-shorts-engine/recovery/gcube-diagnostic-result-v1/ci.py
            /world-simulation-shorts-engine/recovery/gcube-diagnostic-result-v1/recover_existing.py
            /world-simulation-shorts-engine/recovery/gcube-diagnostic-result-v1/image-manifests/**
            /world-simulation-shorts-engine/recovery/gcube-diagnostic-image-v1/startup.py
            /world-simulation-shorts-engine/recovery/gcube-diagnostic-image-v1/records.py
            /world-simulation-shorts-engine/recovery/gcube-diagnostic-image-v1/service.py
            /world-simulation-shorts-engine/recovery/gcube-diagnostic-image-v1/healthcheck.py
            /world-simulation-shorts-engine/recovery/gcube-diagnostic-image-v1/DIAGNOSTIC_FILES.json
            /world-simulation-shorts-engine/recovery/gcube-storage-fix-v1/storage.py
            /world-simulation-shorts-engine/recovery/gcube-storage-fix-v1/launch.py
            /world-simulation-shorts-engine/recovery/gcube-storage-fix-v1/STORAGE_FILES.json
      - name: Require public free standard runner, protected sources and disk-backed 20 GiB
        id: preflight
        run: python3 -B world-simulation-shorts-engine/recovery/universal-production-v3/ci.py preflight
      - name: Check unique tag without writing to registry
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B world-simulation-shorts-engine/recovery/universal-production-v3/ci.py guard
      - name: Run focused V3 tests and actual connected software rendering; reuse prior168 results
        id: test
        run: python3 -B world-simulation-shorts-engine/recovery/universal-production-v3/ci.py test
      - name: Stage only explicit new V3 namespace and its source manifest
        id: stage
        run: python3 -B world-simulation-shorts-engine/recovery/universal-production-v3/ci.py stage
      - name: Build additive production V3 layer preserving all248 parent files
        id: build
        run: python3 -B world-simulation-shorts-engine/recovery/universal-production-v3/ci.py build
      - name: Verify strict inventory, actual connected image software draw and zero secrets
        id: verify
        run: python3 -B world-simulation-shorts-engine/recovery/universal-production-v3/ci.py verify
      - name: Recheck unique tag then publish and inspect remote config digest
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B world-simulation-shorts-engine/recovery/universal-production-v3/ci.py publish
      - name: Persist bounded universal CPU and software evidence only
        if: always() && steps.checkout.outcome == 'success'
        env:
          RESULT_STEP_OUTCOMES: >-
            {"preflight":"${{ steps.preflight.outcome }}","guard":"${{ steps.guard.outcome }}","test":"${{ steps.test.outcome }}","stage":"${{ steps.stage.outcome }}","build":"${{ steps.build.outcome }}","verify":"${{ steps.verify.outcome }}","publish":"${{ steps.publish.outcome }}"}
        run: python3 -B world-simulation-shorts-engine/recovery/universal-production-v3/ci.py persist

  verify-pull:
    needs: build
    if: needs.build.result == 'success' && needs.build.outputs.digest != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    env:
      RESULT_RUNNER_LABEL: ubuntu-24.04
      RESULT_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
      RESULT_PHASE: pull
      RESULT_PUBLISHED_TAG: ${{ needs.build.outputs.tag }}
      RESULT_PUBLISHED_DIGEST: ${{ needs.build.outputs.digest }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Fresh independent checkout of universal and immutable verification helpers
        id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/universal-production-v3.yml
            /world-simulation-shorts-engine/recovery/universal-production-v3/**
            /world-simulation-shorts-engine/recovery/universal-auto-video-v2/**
            /world-simulation-shorts-engine/recovery/reference-visual-master-v2/**
            /world-simulation-shorts-engine/recovery/planner-scene-json-v1/**
            /world-simulation-shorts-engine/web/map_infographic_v1/**
            /cinematic-world-map/assets/**
            /world-simulation-shorts-engine/recovery/visual-quality-upgrade-v1/**
            /world-simulation-shorts-engine/recovery/astra-gpu-activation-v1/**
            /world-simulation-shorts-engine/recovery/astra-gpu-integration-v1/upload_bundle.py
            /world-simulation-shorts-engine/recovery/astra-gpu-integration-v1/gpu_upload.mjs
            /world-simulation-shorts-engine/recovery/gcube-detached-render-v1/JOB_FILES.json
            /world-simulation-shorts-engine/recovery/gcube-detached-render-v1/job_manager.py
            /world-simulation-shorts-engine/recovery/gcube-detached-render-v1/job_store.py
            /world-simulation-shorts-engine/recovery/gcube-detached-render-v1/inspect_existing.py
            /world-simulation-shorts-engine/recovery/rtx-image-build-v1/**
            /world-simulation-shorts-engine/recovery/rtx-gpu-package-v1/source_contract.json
            /world-simulation-shorts-engine/recovery/gcube-65422-render-v1/ci.py
            /world-simulation-shorts-engine/recovery/gcube-65422-render-v1/verify_artifacts.py
            /world-simulation-shorts-engine/recovery/gcube-65422-render-v1/tests/test_artifacts.py
            /world-simulation-shorts-engine/recovery/gcube-65422-render-v1/image-manifests/**
            /world-simulation-shorts-engine/recovery/gcube-diagnostic-result-v1/ci.py
            /world-simulation-shorts-engine/recovery/gcube-diagnostic-result-v1/recover_existing.py
            /world-simulation-shorts-engine/recovery/gcube-diagnostic-result-v1/image-manifests/**
            /world-simulation-shorts-engine/recovery/gcube-diagnostic-image-v1/startup.py
            /world-simulation-shorts-engine/recovery/gcube-diagnostic-image-v1/records.py
            /world-simulation-shorts-engine/recovery/gcube-diagnostic-image-v1/service.py
            /world-simulation-shorts-engine/recovery/gcube-diagnostic-image-v1/healthcheck.py
            /world-simulation-shorts-engine/recovery/gcube-diagnostic-image-v1/DIAGNOSTIC_FILES.json
            /world-simulation-shorts-engine/recovery/gcube-storage-fix-v1/storage.py
            /world-simulation-shorts-engine/recovery/gcube-storage-fix-v1/launch.py
            /world-simulation-shorts-engine/recovery/gcube-storage-fix-v1/STORAGE_FILES.json
      - name: Require free standard runner, source protection and sufficient disk
        id: preflight
        run: python3 -B world-simulation-shorts-engine/recovery/universal-production-v3/ci.py preflight
      - name: Independently pull digest and verify all248 parent files and new V3 closure
        id: pull
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B world-simulation-shorts-engine/recovery/universal-production-v3/ci.py pull
      - name: Persist independent pull evidence without changing application files
        if: always() && steps.checkout.outcome == 'success'
        env:
          RESULT_STEP_OUTCOMES: >-
            {"preflight":"${{ steps.preflight.outcome }}","pull":"${{ steps.pull.outcome }}"}
        run: python3 -B world-simulation-shorts-engine/recovery/universal-production-v3/ci.py persist
