name: Test and publish Gcube proxy-only diagnostic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/gcube-proxy-diag.yml
      - deployment/gcube-proxy-diag/**

permissions:
  contents: read
  packages: write

concurrency:
  group: gcube-proxy-diag
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'dimon3898-sys/yeonhwarok-free'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      IMAGE: ghcr.io/dimon3898-sys/world-simulation-shorts-engine
      RELEASE_TAG: gcube-v006-diag
    steps:
      - name: Checkout diagnostic overlay only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - name: Preserve previously published tags
        shell: bash
        run: |
          set -euo pipefail
          if docker manifest inspect "${IMAGE}:${RELEASE_TAG}" >/dev/null 2>&1; then
            echo 'Diagnostic tag already exists; publication must not overwrite it.'
            exit 1
          fi
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build minimal overlay on immutable v005
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: deployment/gcube-proxy-diag
          file: deployment/gcube-proxy-diag/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: |
            ${{ env.IMAGE }}:${{ env.RELEASE_TAG }}
            ${{ env.IMAGE }}:${{ env.RELEASE_TAG }}-sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Proxy-only diagnosis; engine/GPU/rendering disabled; unchanged v005 validator
      - name: Exact v005 proxy, security and regression tests in the fresh image
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --workdir /opt/world-engine/proxy-diag --entrypoint python "${IMAGE}:${RELEASE_TAG}" \
            /opt/world-engine/proxy-diag/run_checks.py test_observer test_server_diag
          # The approved base deliberately excludes the repository tests/ tree.
          # Mount that test tree read-only for verification; do not change the
          # runtime image, core code, dependency set, or old publishing workflow.
          # Legacy upload fixtures create files beside root-owned application
          # source, and certification checks read an intentionally excluded plan.
          # Run only that legacy suite as root with disposable tmpfs fixtures.
          # The deployed image, diagnostic suite and HTTP boot remain UID 1000.
          docker run --rm --user 0:0 --tmpfs /tmp:rw,nosuid,nodev,size=512m,mode=1777 \
            --mount "type=bind,source=${PWD}/world-simulation-shorts-engine/tests,target=/opt/world-engine/world-simulation-shorts-engine/tests,readonly" \
            --mount "type=bind,source=${PWD}/deliverables/WORLD_SIMULATION_ENGINE/PRODUCTION_DEFAULT_INTEGRATION_v1/scene_plan.json,target=/opt/world-engine/deliverables/WORLD_SIMULATION_ENGINE/PRODUCTION_DEFAULT_INTEGRATION_v1/scene_plan.json,readonly" \
            --entrypoint python "${IMAGE}:${RELEASE_TAG}" \
            /opt/world-engine/proxy-diag/run_checks.py tests.test_mobile_deployment_security tests.test_codespaces_origin \
            deployment.gcube.test_storage deployment.gcube.test_gpu deployment.gcube.test_graphics_start \
            deployment.gcube.test_chromium_wrapper deployment.gcube.test_graphics_runtime \
            deployment.gcube.test_gpu_access deployment.gcube.test_boot_status deployment.gcube.test_server \
            deployment.gcube.test_proxy deployment.gcube.test_start deployment.gcube.test_diagnostics \
            deployment.gcube.test_validation_fixture
      - name: Fresh-image owner login, rejection diagnosis and 61-second foreground life
        shell: bash
        run: |
          set -euo pipefail
          smoke_name="world-gcube-diag-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          smoke_directory="${RUNNER_TEMP}/gcube-diag-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker rm --force "$smoke_name" >/dev/null 2>&1 || true
            rm -f "$smoke_directory/test.env"
            rmdir "$smoke_directory" 2>/dev/null || true
          }
          trap cleanup EXIT
          umask 077
          mkdir "$smoke_directory"
          python - "$smoke_directory/test.env" <<'PY'
          import pathlib,secrets,sys
          owner=secrets.token_urlsafe(32)
          print('::add-mask::'+owner)
          pathlib.Path(sys.argv[1]).write_text('WORLD_ENGINE_OWNER_CODE='+owner+'\nWORLD_ENGINE_STORAGE_MODE=ephemeral\nWORLD_ENGINE_STORAGE_PATH=/data\n')
          PY
          docker run --detach --name "$smoke_name" --publish 127.0.0.1:18010:18011 \
            --publish 127.0.0.1:18012:8000 --env-file "$smoke_directory/test.env" \
            "${IMAGE}:${RELEASE_TAG}" >/dev/null
          python deployment/gcube-proxy-diag/container_smoke.py "$smoke_directory/test.env" "$smoke_name"
          docker exec "$smoke_name" python -c 'import os; assert os.getuid()==1000'
      - name: Authenticate only after all diagnostic tests passed
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish new diagnostic tag without touching v001-v005
        shell: bash
        run: |
          set -euo pipefail
          docker push "${IMAGE}:${RELEASE_TAG}"
          docker push "${IMAGE}:${RELEASE_TAG}-sha-${GITHUB_SHA}"
      - name: Verify anonymous public pull
        shell: bash
        run: |
          set -euo pipefail
          anonymous_directory="${RUNNER_TEMP}/gcube-diag-public-pull-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          umask 077
          mkdir "$anonymous_directory"
          trap 'rm -f "$anonymous_directory/config.json"; rmdir "$anonymous_directory"' EXIT
          printf '{"auths":{}}\n' > "$anonymous_directory/config.json"
          docker --config "$anonymous_directory" pull "${IMAGE}:${RELEASE_TAG}"
