name: WORLD ENGINE capture source integrity once
on:
  push:
    branches: [recovery/capture-source-integrity-20261101]
    paths: ['.github/workflows/world-engine-capture-integrity-once.yml']
permissions:
  contents: write
  packages: write
concurrency:
  group: world-engine-capture-source-integrity-20261101
  cancel-in-progress: false
defaults:
  run:
    shell: bash --noprofile --norc -e -o pipefail {0}
jobs:
  capture-integrity-once:
    if: >-
      github.run_attempt == 1 &&
      github.repository == 'dimon3898-sys/yeonhwarok-free' &&
      github.event.repository.private == false &&
      github.event.before == 'c0e2e8961fdb154ad78a9197fbca9e9efd5249f9' &&
      github.event.head_commit.message == 'WORLD_ENGINE_CAPTURE_SOURCE_INTEGRITY_ONCE_20261101'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            world-simulation-shorts-engine/recovery/capture-source-integrity-v1/
            world-simulation-shorts-engine/recovery/codex-to-gcube-handoff-v1/backend/GENERATED_SOURCE_MANIFEST.json
            world-simulation-shorts-engine/recovery/codex-to-gcube-handoff-v1/capture_vulkan.generated.mjs
            world-simulation-shorts-engine/recovery/codex-to-gcube-handoff-v1/RUNTIME_SOURCE_MANIFEST.json
            world-simulation-shorts-engine/recovery/studio-cold-start-v2/bootstrap.py
            world-simulation-shorts-engine/recovery/studio-cold-start-v2/STARTUP_MANIFEST.json
            world-simulation-shorts-engine/recovery/label355-publication-v1/retain_label355_image.py
      - name: Build integrity pin overlay, retain and publish once
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -B world-simulation-shorts-engine/recovery/capture-source-integrity-v1/build_once.py run
      - name: Preserve evidence after success or failure
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: world-engine-capture-integrity-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/capture-integrity-evidence/
            ${{ runner.temp }}/capture-integrity-retention/*.json
            ${{ runner.temp }}/capture-integrity-context/Dockerfile
          if-no-files-found: error
          retention-days: 1
# No GPU, renderer, compiler, prior PASS suite, deployment or existing tag mutation.
