name: WORLD ENGINE registered geographic 180 sequential CPU
on:
  push:
    branches: [fix/reference-6s-formal-admission-20261113]
    paths: ['.github/workflows/world-engine-reference6s-continuity-cpu.yml']
permissions:
  contents: write
concurrency:
  group: world-engine-reference6s-continuity-cpu
  cancel-in-progress: false
jobs:
  continuity180:
    if: >-
      github.run_attempt == 1 && github.event.repository.private == false &&
      github.repository == 'dimon3898-sys/yeonhwarok-free' &&
      github.event.before == 'dc115d009e6a5c19e174724298c6b556aa830075' &&
      github.event.head_commit.message == 'WORLD_ENGINE_REFERENCE6S_CONTINUITY_CPU_A1'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /world-simulation-shorts-engine/web/
            /world-simulation-shorts-engine/recovery/universal-presentation-v2/
            /world-simulation-shorts-engine/recovery/universal-data-pipeline-v1/
            /world-simulation-shorts-engine/recovery/reference-director-v1/director_events.mjs
            /world-simulation-shorts-engine/recovery/g2-final-recovery-v1/layout_extension.mjs
            /world-simulation-shorts-engine/recovery/g2-final-recovery-v1/fixtures/GENERIC_REGION_INPUTS.zip
            /world-simulation-shorts-engine/production/reference-6s-20261112/
            /cinematic-world-map/assets/
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned free CPU dependencies
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: Pillow==13.0.0
          npm install --prefix "${RUNNER_TEMP}/reference6s-deps" --ignore-scripts --no-audit --no-fund playwright@1.62.1
          "${RUNNER_TEMP}/reference6s-deps/node_modules/.bin/playwright" install --with-deps chromium
          CHROMIUM_PATH=$(node -e "process.stdout.write(require('${RUNNER_TEMP}/reference6s-deps/node_modules/playwright').chromium.executablePath())")
          sudo ln -sfn "${CHROMIUM_PATH}" /usr/bin/chromium
          sudo install -d -m 0755 -o "$(id -u)" -g "$(id -g)" /workspace
      - name: Materialize pinned same-epoch geographic source files
        run: python -B world-simulation-shorts-engine/production/reference-6s-20261112/materialize_geographic_sources.py "${RUNNER_TEMP}/nasa-reference6s"
      - name: Draw first complete sequential state through the official capture path
        env:
          WORLD_ENGINE_NODE_DEPS: ${{ runner.temp }}/reference6s-deps
          NVIDIA_VISIBLE_DEVICES: void
        run: node world-simulation-shorts-engine/production/reference-6s-20261112/run_cpu_continuity.mjs
      - name: Preserve actual output and exact failure checkpoint
        if: always()
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import os,json,shutil,hashlib
          from pathlib import Path
          out=Path('world-simulation-shorts-engine/production/reference-6s-20261112/cpu-continuity-a1');out.mkdir(exist_ok=False)
          src=Path('/workspace/reference6s-continuity')
          result=json.loads((src/'CONTINUITY_RESULT.json').read_text()) if (src/'CONTINUITY_RESULT.json').exists() else {}
          selected={v+d for v in result.get('sourceLevelSwitchFrames',[]) for d in [-1,0,1]}
          for f in src.glob('*'):
              if f.is_file() and (f.name in ['CONTINUITY_RESULT.json','FRAME_SUMMARY.json','CAPTURE_RECEIPT.json','HTTP_ASSET_BINDINGS.json'] or f.suffix=='.png' and int(f.stem.split('_')[1]) in selected):shutil.copy2(f,out/f.name)
          from PIL import Image,ImageDraw
          sheet=Image.new('RGB',(1080,1000),'#202020');draw=ImageDraw.Draw(sheet)
          for i,frame in enumerate([0,15,30,45,60,75,90,105,120,135,149,179]):
              f=src/f'FRAME_{frame:03d}.png'
              if not f.exists():continue
              im=Image.open(f);im.thumbnail((180,320));sheet.paste(im,((i%6)*180,(i//6)*500+25));draw.text(((i%6)*180+5,(i//6)*500+5),str(frame),fill='white')
          sheet.save(out/'CONTINUITY_CONTACT.jpg',quality=92)
          (out/'RUN.json').write_text(json.dumps({'sourceCommit':os.environ['SOURCE_SHA'],'runId':os.environ['RUN_ID'],'gpuStarts':0,'oldPassReruns':0,'visualApproval':'PENDING_REVIEW','captureReceiptPresent':(out/'CAPTURE_RECEIPT.json').exists()},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reference6s-registered-${{ github.run_id }}
          path: |
            world-simulation-shorts-engine/production/reference-6s-20261112/cpu-continuity-a1/
            /workspace/reference6s-continuity/*.png
            /workspace/reference6s-continuity/FRAME_EVIDENCE.json
          retention-days: 90
      - name: Save evidence on the authorized branch only
        if: always()
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          BRANCH=fix/reference-6s-formal-admission-20261113
          REMOTE_SHA=$(git ls-remote origin "refs/heads/${BRANCH}" | cut -f1)
          test "${REMOTE_SHA}" = "${SOURCE_SHA}"
          git config user.name 'WORLD ENGINE CPU evidence'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse world-simulation-shorts-engine/production/reference-6s-20261112/cpu-continuity-a1
          git commit -m 'Preserve reference actual 180-frame continuity evidence'
          git push origin "HEAD:refs/heads/${BRANCH}"
