name: WORLD ENGINE sealed frame1 fix image once
on:
  push:
    branches: [recovery/capture-durable-20261105]
    paths: ['.github/workflows/world-engine-frame1-fix-image-once.yml']
permissions:
  contents: write
  packages: write
concurrency:
  group: world-engine-frame1-fix-image-20261106
  cancel-in-progress: false
defaults:
  run:
    shell: bash --noprofile --norc -e -o pipefail {0}
jobs:
  frame1-fix-image-once:
    if: >-
      github.run_attempt == 1 &&
      github.repository == 'dimon3898-sys/yeonhwarok-free' &&
      github.event.repository.private == false &&
      github.event.before == 'e08efdf39c7f9fe66acfa729d0e33320a32a9010' &&
      github.event.head_commit.message == 'WORLD_ENGINE_FRAME1_FIX_IMAGE_ONCE_20261106'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Fetch common release policy from this exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .world-engine-guard-control
          persist-credentials: false
          sparse-checkout: |
            .github/actions/world-engine-release-guard
            world-simulation-shorts-engine/release-guard
      - name: Install mandatory common image publication gate
        uses: ./.world-engine-guard-control/.github/actions/world-engine-release-guard
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
          sparse-checkout: |
            world-simulation-shorts-engine/recovery/capture-stall-review-v1
            world-simulation-shorts-engine/recovery/reference-label-quality-v1
            world-simulation-shorts-engine/recovery/codex-to-gcube-handoff-v1
            world-simulation-shorts-engine/recovery/studio-cold-start-v2
            world-simulation-shorts-engine/recovery/universal-presentation-v2
      - name: Select supported containerd store for preserved deep parent
        run: |
          sudo python3 - <<'PYCONFIG'
          import json
          from pathlib import Path
          p=Path('/etc/docker/daemon.json'); d=json.loads(p.read_text()) if p.exists() else {}
          d.setdefault('features',{})['containerd-snapshotter']=True
          d['max-download-attempts']=1
          p.write_text(json.dumps(d)+'\n')
          PYCONFIG
          sudo systemctl restart docker
          docker info --format '{{json .DriverStatus}}'
      - name: Package sealed sources, verify installed startup, retain and publish once
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FRAME1_EXPECTED_PARENT: 'e08efdf39c7f9fe66acfa729d0e33320a32a9010'
        run: python3 -B world-simulation-shorts-engine/recovery/capture-stall-review-v1/image-frame1/build_once.py run
# Source/CPU PASS reused. No rendering, GPU allocation, deployment or existing tag mutation.
# Evidence and complete image are retained in a new public Release before GHCR publication.

      - name: Preserve common release gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-guard-${{ github.job }}-${{ github.run_id }}
          path: ${{ runner.temp }}/world-engine-release-evidence/
          if-no-files-found: warn
          retention-days: 90
