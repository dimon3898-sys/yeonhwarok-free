services:
  rtx-package:
    # Placeholder only; replace after a successful build and digest inspection.
    image: rtx-gpu-package-v1:UNBUILT
    restart: "no"
    mem_limit: 8g
    shm_size: 2g
    cpus: 2
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - rtx-storage:/world-storage
    environment:
      NVIDIA_DRIVER_CAPABILITIES: graphics,utility
      WORLD_ENGINE_RENDER_MODE: gpu-required
      RTX_STORAGE_ROOT: /world-storage/rtx-gpu-package-v1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # Default invokes admission, then health only. No automatic proof render.
    command: []
volumes:
  rtx-storage:
