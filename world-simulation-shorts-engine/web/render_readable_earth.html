<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="/v3/">
<title>World Simulation scene renderer</title>
<style>@font-face{font-family:'Open Sans';src:url('/v3/assets/v3/fonts/OpenSans-Light.ttf') format('truetype');font-weight:300;font-display:block}@font-face{font-family:'Noto Cinema';src:url('/static/fonts/NotoSansCJKkr-Regular.otf') format('opentype');font-weight:400;font-display:block}html,body{margin:0;padding:0;background:#000;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/vendor/three/build/three.module.js"}}</script></head><body>
<script type="module">
import {SceneReadableEarthRenderer} from '/static/readability_visual_adapter.js';
try {
 const query=new URLSearchParams(location.search);
 const supplied=window.SCENE_CONFIG;
 let plan=supplied?.plan;
 if(!plan){const url=`/api/projects/${encodeURIComponent(query.get('project')||'')}/versions/${encodeURIComponent(query.get('version')||'v001')}/plan`;const response=await fetch(url);if(!response.ok)throw Error(`Scene plan request ${response.status}`);plan=await response.json();}
 if(plan.plan)plan=plan.plan;
 if(plan.scene_plan)plan=plan.scene_plan;
 const scene=supplied?.scene || (plan.scenes||[]).find(s=>s.scene_id===query.get('scene'));
 if(!scene)throw Error('A verified Scene JSON is required');
 if(scene.production_defaults?.version!=='v1')throw Error('Production Default v1 must be explicitly selected');
 if(scene.visual_polish?.version!=='v004')throw Error('Visual polish must be explicitly selected');
 const app=new SceneReadableEarthRenderer(scene,plan);await app.init();
 window.app=app;window.renderFrame=(time,samples=1)=>app.frame(time,samples);window.ready=true;
}catch(error){window.renderError=String(error?.stack||error);console.error(window.renderError);}
</script></body></html>
