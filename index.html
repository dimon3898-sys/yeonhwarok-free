<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>연화록 무료 사주</title>
  <style>
    body{
      margin:0;
      font-family:Arial,sans-serif;
      background:#f8f0ea;
      color:#3a2b2b;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
      text-align:center;
      padding:24px;
      box-sizing:border-box;
    }
    .card{
      width:100%;
      max-width:420px;
      background:white;
      border-radius:24px;
      padding:32px 24px;
      box-shadow:0 10px 30px rgba(0,0,0,.08);
    }
    h1{
      margin:0 0 12px;
      color:#7b2d2d;
    }
    p{
      line-height:1.7;
      margin:0;
    }
    .btn{
      display:block;
      margin-top:24px;
      padding:16px;
      border-radius:14px;
      background:#7b2d2d;
      color:white;
      text-decoration:none;
      font-weight:bold;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🌸 연화록</h1>
    <p>
      무료 자동 사주 페이지<br>
      연결 테스트 중입니다.
    </p>

    <a class="btn" href="#">
      🔮 내 무료 연화록 펼쳐보기
    </a>
  </div>
</body>
</html>
